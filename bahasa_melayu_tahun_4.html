<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bahasa Melayu Tahun 4</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons (CDN) untuk hiasan bintang/buku sahaja -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Tetapan skrin penuh (16:9 Letterbox) */
        body {
            background-color: #0f172a; /* Latar gelap di luar bingkai */
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* Tiada skrol pada body */
            font-family: sans-serif;
        }

        #app-root {
            width: 100vw;
            height: 56.25vw; /* 16:9 Aspect Ratio (9 / 16 = 0.5625) */
            max-height: 100vh;
            max-width: 177.78vh; /* 16:9 Aspect Ratio (16 / 9 = 1.7778) */
            aspect-ratio: 16 / 9;
            background-color: white;
            position: relative;
            overflow: hidden; /* Pastikan kandungan dalam app tidak terkeluar */
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* Fon khusus untuk kanak-kanak */
        .comic-font {
            font-family: "Comic Sans MS", "Chalkboard SE", sans-serif;
        }

        /* Latar Belakang Corak Titik (Polka Dots) */
        .bg-pattern {
            background-color: #FFFBEB;
            background-image: radial-gradient(#FCD34D 1.5px, transparent 1.5px), radial-gradient(#FCD34D 1.5px, #FFFBEB 1.5px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .animate-fadeInUp { animation: fadeInUp 0.5s ease-out both; }
        .animate-zoomIn { animation: zoomIn 0.3s ease-out; }
        .animate-slideDown { animation: slideDown 0.4s ease-out; }
        .animate-spin-slow { animation: spinSlow 6s linear infinite; }
        
        .lucide {
            display: inline-block;
        }
    </style>
</head>
<body class="text-slate-900">

    <!-- Ruang paparan utama -->
    <div id="app-root"></div>

    <script>
        const courseData = [
            {
                id: 'tema1',
                title: 'Kekeluargaan',
                temaNumber: 1,
                color: 'bg-yellow-300 border-yellow-500 text-yellow-900',
                lightColor: 'bg-yellow-100',
                hexBg: '#FEF3C7',
                icon: 'heart',
                units: [
                    { id: 't1u1', unitNumber: 1, title: 'Keluargaku Sayang', page: 2 },
                    { id: 't1u2', unitNumber: 2, title: 'Membaca Amalan Kami', page: 12 },
                    { id: 't1u3', unitNumber: 3, title: 'Cerita Keluargaku', page: 22 },
                ]
            },
            {
                id: 'tema2',
                title: 'Kesihatan dan Kebersihan',
                temaNumber: 2,
                color: 'bg-pink-300 border-pink-500 text-pink-900',
                lightColor: 'bg-pink-100',
                hexBg: '#FCE7F3',
                icon: 'smile',
                units: [
                    { id: 't2u4', unitNumber: 4, title: 'Kawanku, Cergaskan Diri!', page: 36 },
                    { id: 't2u5', unitNumber: 5, title: 'Sayangi Dirimu', page: 46 },
                    { id: 't2u6', unitNumber: 6, title: 'Saya Bersih dan Saya Sihat', page: 56 },
                ]
            },
            {
                id: 'tema3',
                title: 'Keselamatan Di Sekitar Kita',
                temaNumber: 3,
                color: 'bg-sky-300 border-sky-500 text-sky-900',
                lightColor: 'bg-sky-100',
                hexBg: '#E0F2FE',
                icon: 'shield-alert',
                units: [
                    { id: 't3u7', unitNumber: 7, title: 'Utamakan Keselamatan', page: 70 },
                    { id: 't3u8', unitNumber: 8, title: 'Biar Lambat Asalkan Selamat', page: 80 },
                    { id: 't3u9', unitNumber: 9, title: 'Awas Selalu', page: 92 },
                ]
            },
            {
                id: 'tema4',
                title: 'Kemasyarakatan',
                temaNumber: 4,
                color: 'bg-orange-300 border-orange-500 text-orange-900',
                lightColor: 'bg-orange-100',
                hexBg: '#FFEDD5',
                icon: 'users',
                units: [
                    { id: 't4u10', unitNumber: 10, title: 'Khidmat Masyarakat', page: 106 },
                    { id: 't4u11', unitNumber: 11, title: 'Kami Penyayang', page: 118 },
                    { id: 't4u12', unitNumber: 12, title: 'Bersama-sama Kita Prihatin', page: 130 },
                ]
            },
            {
                id: 'tema5',
                title: 'Seni Budaya',
                temaNumber: 5,
                color: 'bg-purple-300 border-purple-500 text-purple-900',
                lightColor: 'bg-purple-100',
                hexBg: '#F3E8FF',
                icon: 'palette',
                units: [
                    { id: 't5u13', unitNumber: 13, title: 'Indahnya Seni Budaya Kita', page: 146 },
                    { id: 't5u14', unitNumber: 14, title: 'Seni Mempertahankan Diri', page: 158 },
                    { id: 't5u15', unitNumber: 15, title: 'Masyarakatku Kreatif', page: 170 },
                ]
            }
        ];

        let selectedTema = null;
        let selectedUnit = null;

        function renderApp() {
            const root = document.getElementById('app-root');
            
            if (selectedUnit) {
                root.innerHTML = getUnitViewHTML();
            } else if (selectedTema) {
                root.innerHTML = getTemaViewHTML();
            } else {
                root.innerHTML = getHomeViewHTML();
            }

            // Inisialisasi semula ikon Lucide selepas DOM berubah
            lucide.createIcons();
        }

        window.handleSetTema = function(temaId) {
            selectedTema = courseData.find(t => t.id === temaId);
            selectedUnit = null;
            renderApp();
        }

        window.handleSetUnit = function(unitId) {
            selectedUnit = selectedTema.units.find(u => u.id === unitId);
            renderApp();
        }

        window.handleHomeClick = function() {
            selectedTema = null;
            selectedUnit = null;
            renderApp();
        }

        window.handleBackToTema = function() {
            selectedUnit = null;
            renderApp();
        }

        function getHomeViewHTML() {
            // Semua teks ditengah (center)
            let cardsHTML = courseData.map(tema => `
                <button
                    onclick="handleSetTema('${tema.id}')"
                    class="rounded-[2rem] p-4 text-center relative overflow-hidden group hover:shadow-[0_12px_20px_rgba(0,0,0,0.15)] transition-all duration-300 transform hover:-translate-y-1 border-4 border-slate-800 shadow-[0_6px_0_0_rgba(15,23,42,1)] flex flex-col justify-center items-center ${tema.color} active:translate-y-1 active:shadow-[0_2px_0_0_rgba(15,23,42,1)] h-full w-full"
                >
                    <!-- Ikon Latar (Berada di tengah untuk rupa seimbang) -->
                    <div class="absolute inset-0 flex items-center justify-center transform group-hover:scale-110 transition-transform duration-500 ease-in-out opacity-10 pointer-events-none">
                        <i data-lucide="${tema.icon}" style="width: 100px; height: 100px;"></i>
                    </div>
                    
                    <div class="relative z-10 flex flex-col items-center justify-center flex-1 w-full mt-2">
                        <span class="inline-block bg-white bg-opacity-80 text-slate-800 px-4 py-1 rounded-full text-xs sm:text-sm font-black uppercase tracking-widest mb-2 border-2 border-slate-800 shadow-sm">
                            TEMA ${tema.temaNumber}
                        </span>
                        <h3 class="comic-font text-xl sm:text-2xl font-black leading-tight text-slate-900 drop-shadow-sm uppercase text-center w-full px-2">
                            ${tema.title}
                        </h3>
                    </div>
                    
                    <div class="relative z-10 mt-auto flex justify-center w-full pb-1">
                        <div class="bg-white p-2 rounded-full border-2 border-slate-800 group-hover:bg-slate-800 transition-colors shadow-sm flex items-center justify-center">
                            <!-- Butang masuk (kembali.png diputar 180 darjah) -->
                            <img src="kembali.png" alt="Masuk" style="transform: rotate(180deg); width: 20px; height: 20px; filter: drop-shadow(0px 0px 1px rgba(0,0,0,0.5));">
                        </div>
                    </div>
                </button>
            `).join('');

            return `
            <div class="h-full w-full font-sans p-4 sm:p-6 bg-pattern flex flex-col text-center relative">
                
                <!-- Hiasan Latar Utama -->
                <div class="absolute top-4 right-6 text-yellow-500 opacity-40 animate-pulse pointer-events-none">
                    <i data-lucide="sparkles" style="width: 48px; height: 48px;"></i>
                </div>
                
                <!-- Header Bar Utama -->
                <header class="bg-slate-800 text-white px-6 py-4 rounded-[2rem] flex items-center justify-center mb-4 shadow-[0_6px_0_0_rgba(15,23,42,1)] border-4 border-slate-900 z-10 w-full max-w-5xl mx-auto gap-4">
                    <i data-lucide="book" class="text-sky-300" style="width: 28px; height: 28px;"></i>
                    <h1 class="comic-font text-xl sm:text-3xl md:text-4xl font-black tracking-widest uppercase text-center">
                        Bahasa Melayu Tahun 4
                    </h1>
                    <div class="animate-spin-slow text-yellow-400 flex items-center">
                        <i data-lucide="star" style="fill: currentColor; width: 28px; height: 28px;"></i>
                    </div>
                </header>

                <!-- Kotak Arahan & Tajuk Menu (Disatukan untuk jimat ruang vertikal) -->
                <div class="flex flex-col items-center justify-center mb-4 gap-2 z-10">
                    <div class="bg-white px-6 py-2 rounded-[2rem] border-4 border-dashed border-sky-400 shadow-md text-center inline-block transform rotate-1">
                        <p class="comic-font text-lg sm:text-xl text-slate-700 font-bold">
                            Pilih tema untuk mula belajar! ✨
                        </p>
                    </div>
                    <h2 class="text-xs sm:text-sm font-black text-sky-600 uppercase tracking-widest bg-white inline-block px-4 py-1 rounded-full border-2 border-sky-200 mt-2">
                        MENU PEMBELAJARAN (5 TEMA • 15 UNIT)
                    </h2>
                </div>

                <!-- Grid Tema 3x2 -->
                <div class="grid grid-cols-3 grid-rows-2 gap-4 flex-1 min-h-0 w-full max-w-5xl mx-auto pb-2">
                    ${cardsHTML}
                </div>
            </div>
            `;
        }

        function getTemaViewHTML() {
            let unitsHTML = selectedTema.units.map((unit, index) => {
                let textColorClass = selectedTema.color.split(' ').find(c => c.startsWith('text-'));
                return `
                <button
                    onclick="handleSetUnit('${unit.id}')"
                    class="w-full h-full text-center bg-white rounded-[2rem] p-4 sm:p-6 shadow-md hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 border-b-8 border-slate-800 flex flex-col items-center justify-center group cursor-pointer animate-fadeInUp relative overflow-hidden"
                    style="animation-delay: ${index * 0.1}s; animation-fill-mode: both;"
                >
                    <div class="flex flex-col items-center justify-center gap-3 w-full relative z-10">
                        <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-[1.5rem] flex items-center justify-center text-2xl sm:text-3xl font-black ${selectedTema.color} border-4 border-slate-800 shadow-inner rotate-3 group-hover:rotate-6 transition-transform">
                            ${unit.unitNumber}
                        </div>
                        <div class="flex flex-col items-center justify-center w-full px-4">
                            <span class="text-xs sm:text-sm font-bold text-slate-400 uppercase tracking-widest block mb-1">UNIT ${unit.unitNumber}</span>
                            <h3 class="text-xl sm:text-2xl md:text-3xl font-black text-slate-700 group-hover:text-slate-900 transition-colors leading-tight text-center">
                                ${unit.title}
                            </h3>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-center gap-4 mt-4 relative z-10">
                        <span class="text-sm sm:text-base font-bold text-slate-500 bg-slate-100 px-4 py-1.5 rounded-xl border-2 border-slate-200 shadow-inner">
                            Muka Surat ${unit.page}
                        </span>
                        <div class="p-3 rounded-2xl ${selectedTema.color} border-4 border-slate-800 transition-all shadow-md group-hover:scale-110 flex items-center justify-center bg-white">
                            <!-- Butang masuk (kembali.png diputar 180) -->
                            <img src="kembali.png" alt="Masuk" style="transform: rotate(180deg); width: 24px; height: 24px;">
                        </div>
                    </div>
                </button>
            `}).join('');
            
            let textColorClassForThemeLabel = selectedTema.color.split(' ').find(c => c.startsWith('text-'));

            return `
            <div class="h-full w-full font-sans p-4 sm:p-6 bg-pattern flex flex-col text-center" style="background-color: ${selectedTema.hexBg};">
                
                <!-- Header Tema -->
                <div class="flex items-center justify-between mb-6 bg-white p-4 sm:p-6 rounded-[2rem] shadow-lg border-4 border-slate-800 animate-slideDown max-w-5xl mx-auto w-full">
                    <!-- Butang Kembali -->
                    <button 
                        onclick="handleHomeClick()"
                        class="flex items-center justify-center gap-2 text-slate-700 hover:bg-slate-100 p-3 sm:px-5 sm:py-3 rounded-2xl transition-colors font-bold border-2 border-transparent hover:border-slate-300"
                    >
                        <img src="kembali.png" alt="Kembali" style="width: 24px; height: 24px;">
                        <span class="hidden sm:inline uppercase tracking-wider text-sm">KEMBALI</span>
                    </button>
                    
                    <!-- Tajuk Tengah -->
                    <div class="flex-1 flex flex-col items-center justify-center text-center px-4">
                        <span class="text-xs sm:text-sm font-black ${textColorClassForThemeLabel} tracking-widest uppercase bg-opacity-20 px-4 py-1 rounded-full inline-block mb-1 shadow-sm border border-transparent">
                            TEMA ${selectedTema.temaNumber}
                        </span>
                        <h2 class="text-2xl sm:text-3xl md:text-4xl font-black text-slate-800 uppercase text-center leading-tight">
                            ${selectedTema.title}
                        </h2>
                    </div>
                    
                    <!-- Butang Home -->
                    <button 
                        onclick="handleHomeClick()"
                        class="flex items-center justify-center gap-2 text-slate-700 hover:bg-slate-100 p-3 rounded-2xl transition-colors font-bold border-2 border-transparent hover:border-slate-300"
                    >
                        <img src="home.png" alt="Utama" style="width: 28px; height: 28px;">
                    </button>
                </div>

                <!-- Senarai Unit (Flex-1 & Grid Rows 3 agar ngam 16:9 vertical space) -->
                <div class="flex-1 grid grid-rows-3 gap-4 min-h-0 w-full max-w-5xl mx-auto pb-4">
                    ${unitsHTML}
                </div>
            </div>
            `;
        }

        function getUnitViewHTML() {
            return `
            <div class="h-full w-full font-sans p-4 sm:p-6 flex flex-col items-center justify-center relative bg-pattern text-center">
                
                <!-- Elemen hiasan terapung -->
                <div class="absolute top-10 left-16 text-yellow-400 opacity-50 animate-pulse pointer-events-none">
                    <i data-lucide="sparkles" style="width: 56px; height: 56px;"></i>
                </div>
                <div class="absolute bottom-16 right-16 text-pink-400 opacity-50 animate-bounce pointer-events-none">
                    <i data-lucide="star" style="width: 48px; height: 48px;"></i>
                </div>

                <!-- Kontena Utama Kandungan Unit -->
                <div class="max-w-3xl w-full h-full max-h-[85%] bg-white rounded-[2.5rem] shadow-2xl flex flex-col border-8 border-sky-200 z-10 animate-zoomIn overflow-hidden">
                    
                    <!-- Top Bar Unit -->
                    <div class="bg-sky-400 p-4 sm:p-5 flex items-center justify-between border-b-8 border-sky-500 rounded-t-[1.8rem]">
                        <button 
                            onclick="handleBackToTema()"
                            class="text-white hover:bg-sky-500 p-3 rounded-2xl transition-colors flex items-center justify-center gap-2 border-2 border-transparent hover:border-white"
                        >
                            <img src="kembali.png" alt="Kembali" style="width: 24px; height: 24px; filter: brightness(0) invert(1);">
                            <span class="font-bold text-sm sm:text-base hidden sm:inline tracking-wider uppercase">KEMBALI</span>
                        </button>
                        
                        <h2 class="text-white text-xl sm:text-3xl font-black uppercase tracking-widest drop-shadow-md text-center flex-1">
                            UNIT ${selectedUnit.unitNumber}
                        </h2>
                        
                        <button 
                            onclick="handleHomeClick()"
                            class="text-white hover:bg-sky-500 p-3 rounded-2xl transition-colors flex items-center justify-center border-2 border-transparent hover:border-white"
                        >
                            <img src="home.png" alt="Utama" style="width: 28px; height: 28px; filter: brightness(0) invert(1);">
                        </button>
                    </div>
                    
                    <!-- Ruang Kandungan Pembelajaran -->
                    <div class="flex-1 flex flex-col items-center justify-center p-8 sm:p-12 bg-gradient-to-b from-sky-50 to-white text-center">
                        <h1 class="text-3xl sm:text-5xl font-black text-sky-800 mb-8 drop-shadow-sm leading-tight px-4 text-center">
                            ${selectedUnit.title}
                        </h1>
                        
                        <div class="bg-white p-8 sm:p-10 rounded-[2rem] border-4 border-dashed border-sky-300 shadow-inner flex flex-col items-center text-center max-w-2xl w-full">
                            <p class="text-xl sm:text-2xl text-sky-700 font-medium leading-relaxed">
                                Mari belajar <strong class="text-sky-900 font-black">Unit ${selectedUnit.unitNumber}</strong> bersama-sama!
                            </p>
                            <div class="mt-4 bg-sky-100 border-2 border-sky-200 px-6 py-3 rounded-full">
                                <p class="text-lg sm:text-xl text-sky-800 font-bold">
                                    Buka buku teks muka surat <span class="text-2xl text-sky-900 bg-white px-3 py-1 rounded-xl shadow-sm mx-1">${selectedUnit.page}</span>
                                </p>
                            </div>
                            
                            <div class="mt-8 animate-bounce flex justify-center">
                                <i data-lucide="book" class="text-sky-400" style="width: 70px; height: 70px;"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            `;
        }

        // Mulakan aplikasi apabila halaman siap dimuatkan
        window.onload = () => {
            renderApp();
        };
    </script>
</body>
</html>
