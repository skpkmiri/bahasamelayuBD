<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bahasa Melayu Tahun 3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #E0F7FA;
            background-image: radial-gradient(#B2EBF2 2px, transparent 2px);
            background-size: 30px 30px;
            color: #333;
            -webkit-tap-highlight-color: transparent;
        }
        h1, h2, h3, .font-chewy { font-family: 'Chewy', cursive; }
        
        .btn-3d {
            transition: all 0.15s ease;
            transform: translateY(0);
        }
        .btn-3d:hover { transform: translateY(-4px); }
        .btn-3d:active { transform: translateY(4px); box-shadow: 0 0px 0 transparent !important; }
        
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .bounce-in { animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen pb-10">

    <!-- Navigasi Tepi -->
    <div class="fixed top-2 left-2 md:top-4 md:left-4 flex gap-2 z-50">
        <button onclick="goHome()" class="btn-3d bg-blue-500 text-white p-3 md:p-4 rounded-full text-xl shadow-[0_5px_0_#0b3982] hover:bg-blue-400">
            <i class="fas fa-home"></i>
        </button>
        <button id="btn-back" onclick="goBack()" class="btn-3d bg-yellow-400 text-yellow-900 p-3 md:p-4 rounded-full text-xl shadow-[0_5px_0_#b78a00] hover:bg-yellow-300 hidden">
            <i class="fas fa-arrow-left"></i>
        </button>
    </div>

    <!-- Banner Utama (Hanya di Paparan Hadapan) -->
    <header id="main-banner" class="pt-16 pb-6 text-center w-full max-w-4xl mx-auto px-4 fade-in">
        <h1 class="text-5xl md:text-7xl text-blue-600 drop-shadow-[4px_4px_0_#fff] mb-2" style="text-shadow: 3px 3px 0 #FFF, -3px -3px 0 #FFF, 3px -3px 0 #FFF, -3px 3px 0 #FFF, 5px 5px 15px rgba(0,0,0,0.1);">
            BAHASA MELAYU
        </h1>
        <h2 class="text-4xl md:text-5xl text-rose-500 drop-shadow-[3px_3px_0_#fff]" style="text-shadow: 2px 2px 0 #FFF, -2px -2px 0 #FFF, 2px -2px 0 #FFF, -2px 2px 0 #FFF;">
            TAHUN 3
        </h2>
        <div class="w-24 h-1.5 bg-yellow-400 mx-auto mt-6 rounded-full"></div>
    </header>

    <!-- CONTAINER UTAMA -->
    <main class="max-w-6xl mx-auto px-4 mt-6">
        
        <!-- VIEW 1: HOME (Grid Tema) -->
        <section id="view-home" class="view-section fade-in">
            <div class="bg-white/60 backdrop-blur-sm p-6 md:p-10 rounded-[2.5rem] shadow-2xl border-4 border-white/60 max-w-5xl mx-auto">
                <div id="tema-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4 md:gap-6 justify-center w-full">
                    <!-- Dijana melalui JS -->
                </div>
            </div>
        </section>

        <!-- VIEW 2: SENARAI UNIT -->
        <section id="view-units" class="view-section hidden fade-in">
            <h2 id="title-tema" class="text-3xl md:text-5xl text-center font-chewy text-purple-600 mb-8 drop-shadow-md bg-white py-4 rounded-3xl border-4 border-purple-200"></h2>
            <div id="unit-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Dijana melalui JS -->
            </div>
        </section>

        <!-- VIEW 3: SENARAI AKTIVITI -->
        <section id="view-activities" class="view-section hidden fade-in">
            <h2 id="title-unit" class="text-3xl md:text-4xl text-center font-chewy text-teal-600 mb-8 drop-shadow-md bg-white py-4 rounded-3xl border-4 border-teal-200 px-4"></h2>
            <div id="activity-list" class="flex flex-col gap-4 max-w-2xl mx-auto">
                <!-- Dijana melalui JS -->
            </div>
            <!-- Ruang Kosong (Jika tiada aktiviti) -->
            <div id="ruang-kosong" class="hidden text-center mt-10 p-10 bg-gradient-to-br from-white to-blue-50 border-4 border-yellow-400 border-dashed rounded-3xl relative overflow-hidden shadow-lg">
                <div class="absolute top-4 left-4 animate-bounce text-2xl">⭐</div>
                <div class="absolute bottom-4 right-4 animate-bounce text-2xl" style="animation-delay: 0.5s;">🎈</div>
                <div class="w-24 h-24 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-4 transition-transform hover:scale-110">
                    <i class="fas fa-shapes text-5xl text-blue-500"></i>
                </div>
                <h3 class="text-3xl font-chewy text-rose-500 mb-2">Ruang Pembelajaran</h3>
                <p class="text-blue-800 font-bold text-lg">Kandungan unit ini akan ditambah pada masa akan datang!</p>
            </div>
        </section>

        <!-- VIEW 4: PLAYGROUND (Main Aktiviti) -->
        <section id="view-play" class="view-section hidden fade-in">
            <div class="bg-white/90 backdrop-blur-sm p-4 md:p-8 rounded-3xl border-4 border-indigo-200 shadow-xl max-w-5xl mx-auto min-h-[60vh] flex flex-col">
                <h2 id="play-title" class="text-2xl md:text-3xl font-chewy text-indigo-600 mb-6 text-center border-b-4 border-dashed border-indigo-100 pb-4"></h2>
                
                <div id="play-container" class="flex-grow flex flex-col justify-center">
                    <!-- Kandungan interaktif disuntik di sini -->
                </div>
            </div>
        </section>

    </main>

    <!-- MODAL MAKLUM BALAS (Betul / Salah) -->
    <div id="modal-feedback" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-[100] backdrop-blur-sm p-4">
        <div class="bg-white p-8 rounded-3xl text-center w-full max-w-md mx-auto shadow-2xl border-4 border-white bounce-in">
            <div id="feedback-icon" class="text-6xl mb-4"></div>
            <h3 id="feedback-title" class="text-3xl font-chewy mb-4"></h3>
            <p id="feedback-message" class="text-lg text-gray-600 font-bold mb-6 leading-relaxed"></p>
            <button id="btn-next" class="w-full btn-3d bg-blue-500 text-white font-bold text-xl py-4 rounded-xl shadow-[0_5px_0_#0b3982]">
                Seterusnya
            </button>
        </div>
    </div>

            {

                units: [
                    { title: "Unit 4: Sepakat Membawa Berkat", activities: [] },
                    { title: "Unit 5: Seronoknya Hidup Berjiran", activities: [] },
                    { title: "Unit 6: Kami Prihatin", activities: [] }
                ]
            },
            {
                tema: "TEMA 3: KESIHATAN DAN KEBERSIHAN", color: "from-teal-400 to-teal-600",
                units: [
                    { title: "Unit 7: Saya Sihat Saya Gembira", activities: [] },
                    { title: "Unit 8: Alam Bersih Hidup Bahagia", activities: [] },
                    { title: "Unit 9: Gaya Hidup Sihat", activities: [] }
                ]
            },
            { tema: "TEMA 4: KESELAMATAN", color: "from-orange-400 to-orange-600", units: [] },
            { tema: "TEMA 5: PERPADUAN", color: "from-blue-400 to-blue-600", units: [] }
        ];

        // --- SISTEM STATE (Penyimpan Data Semasa) ---
        let navHistory = ['view-home'];
        let activeData = null; // Menyimpan data aktiviti yang sedang berjalan
        let stepIndex = 0; // Untuk aktiviti jenis MCQ
        let selectedIndex = null; // Untuk Drag & Drop sentuhan

        function navigateTo(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
            
            navHistory.push(viewId);
            updateNavButtons();
            
            // Sembunyikan banner utama jika bukan di Home
            const banner = document.getElementById('main-banner');
            if (viewId === 'view-home') banner.classList.remove('hidden');
            else banner.classList.add('hidden');
        }

        function goBack() {
            if (navHistory.length > 1) {
                navHistory.pop(); // buang view sekarang
                const prev = navHistory[navHistory.length - 1];
                
                document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
                document.getElementById(prev).classList.remove('hidden');
                
                updateNavButtons();
                const banner = document.getElementById('main-banner');
                if (prev === 'view-home') banner.classList.remove('hidden');
            }
        }

        function goHome() {
            window.location.href = 'index.html';
        }

        function updateNavButtons() {
            const btnBack = document.getElementById('btn-back');
            if (navHistory.length > 1) btnBack.classList.remove('hidden');
            else btnBack.classList.add('hidden');
        }

        function initApp() {
            const grid = document.getElementById('tema-grid');
            grid.innerHTML = '';
            
            dataKurikulum.forEach((tema, idx) => {
                const btn = document.createElement('button');
                // Susunan khas Tema 5 ke tengah
                const specialClass = (idx === 4) ? 'sm:col-span-2 mx-auto w-full sm:w-[50%]' : 'w-full';
                btn.className = `btn-3d p-6 md:p-8 rounded-3xl text-white font-chewy text-2xl md:text-3xl text-left flex justify-between items-center shadow-lg hover:shadow-xl bg-gradient-to-r ${tema.color} ${specialClass} border-b-[6px] border-black/20`;
                btn.innerHTML = `<span>${tema.tema}</span> <i class="fas fa-chevron-right ml-2 text-white/50"></i>`;
                btn.onclick = () => openTema(idx);
                grid.appendChild(btn);
            });
        }

        function openTema(temaIdx) {
            const temaData = dataKurikulum[temaIdx];
            document.getElementById('title-tema').innerText = temaData.tema;
            
            const grid = document.getElementById('unit-grid');
            grid.innerHTML = '';
            
            if (temaData.units && temaData.units.length > 0) {
                temaData.units.forEach((unit, idx) => {
                    const btn = document.createElement('button');
                    btn.className = `btn-3d bg-white rounded-3xl p-6 text-center border-4 border-gray-100 shadow-xl group hover:border-purple-300 flex flex-col items-center`;
                    btn.innerHTML = `
                        <div class="w-16 h-16 rounded-full flex items-center justify-center text-2xl font-chewy text-white bg-gradient-to-br ${temaData.color} mb-4">${idx + 1}</div>
                        <div class="text-lg md:text-xl font-bold text-gray-700 leading-snug">${unit.title}</div>
                    `;
                    btn.onclick = () => openUnit(temaIdx, idx);
                    grid.appendChild(btn);
                });
            } else {
                grid.innerHTML = `<div class="col-span-full text-center text-gray-500 font-bold p-10 bg-white rounded-3xl">Kandungan tema ini akan dikemas kini kelak!</div>`;
            }
            navigateTo('view-units');
        }

        function openUnit(temaIdx, unitIdx) {
            const unitData = dataKurikulum[temaIdx].units[unitIdx];
            document.getElementById('title-unit').innerText = unitData.title;
            
            const list = document.getElementById('activity-list');
            const ruangKosong = document.getElementById('ruang-kosong');
            list.innerHTML = '';
            
            if (unitData.activities && unitData.activities.length > 0) {
                ruangKosong.classList.add('hidden');
                list.classList.remove('hidden');
                
                unitData.activities.forEach((act, actIdx) => {
                    const btn = document.createElement('button');
                    btn.className = `btn-3d w-full bg-white p-5 rounded-2xl border-4 border-teal-100 flex items-center gap-4 hover:bg-teal-50 text-left shadow-md mb-2`;
                    btn.innerHTML = `
                        <div class="bg-teal-500 text-white w-12 h-12 rounded-xl flex items-center justify-center text-2xl"><i class="fas fa-play"></i></div>
                        <div class="font-bold text-xl text-teal-800">${act.name}</div>
                    `;
                    btn.onclick = () => openActivity(temaIdx, unitIdx, actIdx);
                    list.appendChild(btn);
                });
            } else {
                list.classList.add('hidden');
                ruangKosong.classList.remove('hidden');
            }
            navigateTo('view-activities');
        }

        function openActivity(temaIdx, unitIdx, actIdx) {
            // Salin data aktiviti supaya tidak mengubah data asal
            activeData = JSON.parse(JSON.stringify(dataKurikulum[temaIdx].units[unitIdx].activities[actIdx]));
            document.getElementById('play-title').innerText = activeData.name;
            
            // Set up state
            stepIndex = 0;
            selectedIndex = null;
            
            // Sediakan fail data dalaman tambahan jika perlu
            if (activeData.type === 'padan' || activeData.type === 'padan-overlay') {
                activeData.poolState = activeData.pool.map((t, i) => ({ text: t, used: false, id: i }));
            } else if (activeData.type === 'kategori-inline') {
                activeData.pool.forEach((p, i) => { p.id = i; p.catId = null; });
            }

            renderActivityView();
            navigateTo('view-play');
        }

        function renderActivityView() {
            const container = document.getElementById('play-container');
            container.innerHTML = '';
            
            if (activeData.type === 'mcq') renderMCQ(container);
            else if (activeData.type === 'padan') renderPadan(container);
            else if (activeData.type === 'padan-overlay') renderPadanOverlay(container);
            else if (activeData.type === 'kategori-inline') renderKategoriInline(container);
        }

        function renderMCQ(container) {
            if (stepIndex >= activeData.items.length) {
                showCompletion();
                return;
            }
            
            const q = activeData.items[stepIndex];
            
            // Jana 4 Pilihan Rawak (1 Betul, 3 Salah)
            let wrongOptions = activeData.pool.filter(opt => opt !== q.ans);
            wrongOptions = wrongOptions.sort(() => 0.5 - Math.random()).slice(0, 3);
            let options = [q.ans, ...wrongOptions].sort(() => 0.5 - Math.random());

            let mediaHtml = '';
            if (q.type === 'video') {
                mediaHtml = `<div class="bg-black p-2 rounded-xl mb-4 md:mb-0 w-full flex justify-center shadow-lg">
                                <video src="${q.media}" controls autoplay class="max-h-[50vh] max-w-full rounded-lg"></video>
                             </div>`;
            } else {
                mediaHtml = `<img src="${q.media}" alt="Soalan" class="max-h-[50vh] object-contain rounded-xl shadow-lg border-4 border-white mb-4 md:mb-0">`;
            }

            // Layout Side-by-Side untuk menjimatkan ruang skrin
            let html = `
                <div class="flex flex-col md:flex-row gap-6 items-center w-full">
                    <div class="w-full md:w-1/2 flex justify-center">
                        ${mediaHtml}
                    </div>
                    <div class="w-full md:w-1/2 grid grid-cols-1 gap-4">
            `;
            
            options.forEach((opt, idx) => {
                html += `<button onclick="checkMCQ(${idx})" class="btn-3d w-full bg-white border-4 border-blue-200 text-blue-800 font-bold p-4 md:p-5 rounded-2xl text-left md:text-lg hover:bg-blue-50 hover:border-blue-400">
                            ${opt}
                         </button>`;
            });
            
            html += `</div></div>
                     <div class="text-center mt-6 text-gray-500 font-bold bg-gray-100 rounded-full py-1 px-4 inline-block mx-auto">
                        Soalan ${stepIndex + 1} / ${activeData.items.length}
                     </div>`;
                     
            container.innerHTML = html;
            
            // Simpan jawapan untuk semakan melalui index butang
            activeData.currentOptions = options; 
            activeData.currentAns = q.ans;
        }

        function checkMCQ(optIndex) {
            const selected = activeData.currentOptions[optIndex];
            const correct = activeData.currentAns;
            
            if (selected === correct) {
                stepIndex++;
                showFeedback(true, correct, selected, () => renderActivityView());
            } else {
                showFeedback(false, correct, selected, () => renderActivityView());
            }
        }

        function renderPadan(container) {
            let html = `<div class="grid grid-cols-2 md:grid-cols-3 gap-6 mb-8 w-full">`;
            
            // Bahagian Target
            activeData.targets.forEach((t, i) => {
                const placedItem = t.placedId !== undefined ? activeData.poolState.find(p => p.id === t.placedId) : null;
                const isTargeted = selectedIndex !== null;
                const hoverClass = isTargeted ? 'border-rose-400 bg-rose-50 cursor-pointer animate-pulse' : 'border-gray-300 bg-gray-50';
                
                let contentHtml = '';
                if (t.image) {
                    contentHtml = `<img src="${t.image}" class="h-24 md:h-32 object-contain mx-auto mb-4 rounded border-2 border-gray-100">`;
                } else if (t.text) {
                    contentHtml = `<div class="text-lg md:text-xl font-bold text-center mb-4 text-gray-700">${t.text}</div>`;
                }
                
                html += `<div class="bg-white p-4 rounded-xl shadow-md border-2 border-gray-100 flex flex-col justify-between h-full">
                            ${contentHtml}
                            `;
                            
                if (placedItem) {
                    html += `<div class="w-full bg-green-100 text-green-800 border-4 border-green-500 font-bold p-2 md:p-3 rounded-xl text-center md:text-lg shadow-sm">
                                <i class="fas fa-check-circle mr-1"></i>${placedItem.text}
                             </div>`;
                } else {
                    html += `<div onclick="tapPlace(${i})" class="w-full h-12 md:h-14 border-4 border-dashed rounded-xl flex items-center justify-center font-bold transition-all ${hoverClass}">
                             </div>`;
                }
                html += `</div>`;
            });
            html += `</div>`;
            
            // Bahagian Pool (Pilihan Jawapan)
            html += `<div class="bg-blue-50 p-4 rounded-2xl border-4 border-blue-200"><h3 class="text-center font-bold text-blue-400 mb-3 uppercase tracking-wider">Pilihan Jawapan</h3><div class="flex flex-wrap gap-3 justify-center">`;
            
            activeData.poolState.forEach((p, i) => {
                if (p.used) return;
                const isSelected = selectedIndex === i;
                const btnClass = isSelected ? 'bg-rose-500 text-white border-rose-600 scale-110 shadow-lg' : 'bg-white text-blue-700 border-blue-300 hover:bg-blue-100';
                html += `<button onclick="tapSelect(${i})" class="btn-3d border-b-4 font-bold p-3 md:p-4 rounded-xl text-sm md:text-base transition-all ${btnClass}">
                            ${p.text}
                         </button>`;
            });
            
            html += `</div></div>`;
            container.innerHTML = html;
        }

        function renderPadanOverlay(container) {
            // Container Gambar Utama
            let html = `<div class="relative w-full max-w-4xl mx-auto mb-8 border-4 border-white shadow-2xl rounded-2xl overflow-hidden bg-white">
                            <img src="${activeData.image}" class="w-full h-auto block select-none pointer-events-none">`;
            
            // Kotak Target Overlay
            activeData.targets.forEach((t, i) => {
                const placedItem = t.placedId !== undefined ? activeData.poolState.find(p => p.id === t.placedId) : null;
                const isTargeted = selectedIndex !== null;
                
                html += `<div class="absolute" style="top: ${t.top}%; left: ${t.left}%; width: ${t.w}%; height: ${t.h}%;">`;
                
                if (placedItem) {
                    html += `<div class="w-full h-full bg-green-100 text-green-800 border-2 border-green-600 font-bold flex items-center justify-center text-[9px] md:text-sm shadow-lg overflow-hidden p-1 text-center leading-tight rounded">
                                ${placedItem.text}
                             </div>`;
                } else {
                    const hoverClass = isTargeted ? 'border-rose-500 bg-rose-300/60 animate-pulse ring-4 ring-rose-300 cursor-pointer' : 'border-gray-800 bg-white/50';
                    html += `<div onclick="tapPlace(${i})" class="w-full h-full border-2 md:border-4 border-dashed rounded shadow-md backdrop-blur-sm transition-all ${hoverClass}"></div>`;
                }
                html += `</div>`;
            });
            
            html += `</div>`;
            
            // Bahagian Pool
            html += `<div class="flex flex-wrap gap-3 justify-center w-full max-w-4xl mx-auto bg-blue-50 p-4 rounded-2xl border-4 border-blue-200">`;
            activeData.poolState.forEach((p, i) => {
                if (p.used) return;
                const isSelected = selectedIndex === i;
                const btnClass = isSelected ? 'bg-rose-500 text-white border-rose-600 scale-110 shadow-lg' : 'bg-white text-blue-700 border-blue-300 hover:bg-blue-100';
                html += `<button onclick="tapSelect(${i})" class="btn-3d border-b-4 font-bold p-3 md:p-4 rounded-xl text-sm md:text-base transition-all ${btnClass}">
                            ${p.text}
                         </button>`;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        // Logik Tap & Drop Umum
        function tapSelect(poolIndex) {
            selectedIndex = (selectedIndex === poolIndex) ? null : poolIndex; // Toggle
            renderActivityView();
        }

        function tapPlace(targetIndex) {
            if (selectedIndex === null) return;
            
            const poolItem = activeData.poolState[selectedIndex];
            const target = activeData.targets[targetIndex];
            
            if (poolItem.text === target.ans) {
                // Betul
                target.placedId = poolItem.id;
                poolItem.used = true;
                selectedIndex = null;
                renderActivityView();
                
                // Semak siap sepenuhnya
                if (activeData.targets.every(t => t.placedId !== undefined)) {
                    setTimeout(showCompletion, 600);
                }
            } else {
                // Salah
                selectedIndex = null;
                showFeedback(false, target.ans, poolItem.text, () => renderActivityView());
            }
        }

        function renderKategoriInline(container) {
            let html = `<div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full mb-8">`;
            
            // Ruang Kategori
            activeData.categories.forEach(cat => {
                const itemsInCat = activeData.pool.filter(p => p.catId === cat.id);
                html += `<div class="bg-white border-4 border-purple-200 rounded-2xl p-4 shadow-md min-h-[200px] flex flex-col">
                            <h3 class="text-xl font-chewy text-purple-600 text-center border-b-2 border-purple-100 pb-2 mb-4">${cat.name}</h3>
                            <div onclick="tapPlaceKategori('${cat.id}')" class="flex-grow flex flex-col gap-2 rounded-xl p-2 ${selectedIndex !== null ? 'bg-purple-50 border-2 border-dashed border-purple-400 cursor-pointer' : 'bg-gray-50 border-2 border-dashed border-transparent'} transition-colors">
                            `;
                            
                itemsInCat.forEach(item => {
                    let styleClass = 'bg-blue-100 text-blue-800 border-blue-300';
                    let icon = '';
                    if (activeData.isChecked) {
                        const isCorrect = item.ans === cat.id;
                        styleClass = isCorrect ? 'bg-green-100 text-green-800 border-green-500 shadow' : 'bg-red-50 text-red-500 border-red-300 line-through opacity-80';
                        icon = isCorrect ? '<i class="fas fa-check text-green-600 mr-2"></i>' : '<i class="fas fa-times text-red-500 mr-2"></i>';
                    }
                    html += `<div onclick="kembalikanItemKategori(${item.id}); event.stopPropagation();" class="p-3 border-2 rounded-lg font-bold text-center cursor-pointer ${styleClass}">
                                ${icon}${item.text}
                             </div>`;
                });
                
                html += `   </div>
                         </div>`;
            });
            html += `</div>`;
            
            // Butang Semak
            if (!activeData.isChecked && activeData.pool.every(p => p.catId !== null)) {
                html += `<button onclick="semakKategori()" class="btn-3d w-full max-w-sm mx-auto mb-8 bg-green-500 text-white font-chewy text-2xl py-4 rounded-2xl border-b-[6px] border-green-700 shadow-xl block">
                            Semak Jawapan
                         </button>`;
            } else if (activeData.isChecked) {
                html += `<button onclick="showCompletion()" class="btn-3d w-full max-w-sm mx-auto mb-8 bg-blue-500 text-white font-chewy text-2xl py-4 rounded-2xl border-b-[6px] border-blue-700 shadow-xl block bounce-in">
                            Selesai Seterusnya!
                         </button>`;
            }

            // Pool Bawah
            if (!activeData.isChecked) {
                html += `<div class="flex flex-wrap gap-3 justify-center w-full max-w-4xl mx-auto bg-gray-100 p-4 rounded-2xl border-4 border-gray-200">`;
                activeData.pool.forEach((p) => {
                    if (p.catId !== null) return;
                    const isSelected = selectedIndex === p.id;
                    const btnClass = isSelected ? 'bg-rose-500 text-white border-rose-600 scale-110 shadow-lg' : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-200';
                    html += `<button onclick="tapSelect(${p.id})" class="btn-3d border-b-4 font-bold p-3 md:p-4 rounded-xl text-sm md:text-base transition-all ${btnClass}">
                                ${p.text}
                             </button>`;
                });
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        function tapPlaceKategori(catId) {
            if (selectedIndex === null || activeData.isChecked) return;
            const item = activeData.pool.find(p => p.id === selectedIndex);
            item.catId = catId;
            selectedIndex = null;
            renderActivityView();
        }
        
        function kembalikanItemKategori(itemId) {
            if (activeData.isChecked) return;
            const item = activeData.pool.find(p => p.id === itemId);
            item.catId = null;
            renderActivityView();
        }
        
        function semakKategori() {
            activeData.isChecked = true;
            renderActivityView();
        }

        function showFeedback(isCorrect, rightAns, wrongAns, callback) {
            const modal = document.getElementById('modal-feedback');
            const icon = document.getElementById('feedback-icon');
            const title = document.getElementById('feedback-title');
            const msg = document.getElementById('feedback-message');
            const btn = document.getElementById('btn-next');
            
            if (isCorrect) {
                icon.innerHTML = '<span class="text-green-500">🌟</span>';
                title.innerText = 'Syabas!';
                title.className = 'text-4xl font-chewy text-green-500 mb-4';
                msg.innerHTML = 'Jawapan anda betul!';
            } else {
                icon.innerHTML = '<span class="text-rose-500">💡</span>';
                title.innerText = 'Cuba Lagi!';
                title.className = 'text-4xl font-chewy text-rose-500 mb-4';
                msg.innerHTML = `Jawapan anda salah.<br><br><span class="text-sm text-gray-400">Jawapan sebenar:</span><br><span class="text-blue-600">${rightAns}</span>`;
            }
            
            btn.onclick = () => {
                modal.classList.add('hidden');
                if (callback) callback();
            };
            
            modal.classList.remove('hidden');
        }

        function showCompletion() {
            const modal = document.getElementById('modal-feedback');
            document.getElementById('feedback-icon').innerHTML = '🏆';
            const title = document.getElementById('feedback-title');
            title.innerText = 'Tahniah!';
            title.className = 'text-4xl font-chewy text-yellow-500 mb-4';
            
            document.getElementById('feedback-message').innerHTML = `Anda telah berjaya melengkapkan aktiviti ini dengan cemerlang!`;
            
            const btnNext = document.getElementById('btn-next');
            btnNext.innerText = 'Kembali ke Unit';
            btnNext.onclick = () => {
                modal.classList.add('hidden');
                goBack();
            };
            
            modal.classList.remove('hidden');
        }

        // Init App on load
        window.onload = initApp;

    </script>
</body>
</html>
