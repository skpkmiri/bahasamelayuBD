            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }

        let activeData = null; 
        let stepIndex = 0; 
        let selectedIndex = null; 

        function navigateTo(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
            
            navHistory.push(viewId);
            updateNavButtons();
            
            const banner = document.getElementById('main-banner');
            if (viewId === 'view-home') banner.classList.remove('hidden');
            else banner.classList.add('hidden');
        }

        function goBack() {
            if (navHistory.length > 1) {
                navHistory.pop(); 
                const prev = navHistory[navHistory.length - 1];
                
                document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
                document.getElementById(prev).classList.remove('hidden');
                
                updateNavButtons();
                const banner = document.getElementById('main-banner');
                if (prev === 'view-home') banner.classList.remove('hidden');
                else banner.classList.add('hidden');
            }
        }

        function goHome() {
            window.location.href = 'index.html';
        }

        function updateNavButtons() {
            const btnBack = document.getElementById('btn-back');
            if (navHistory.length > 1) btnBack.classList.remove('hidden');
            else btnBack.classList.add('hidden');
        }

        function initApp() {
            const grid = document.getElementById('tema-grid');
            grid.innerHTML = '';
            
            dataKurikulum.forEach((tema, idx) => {
                const btn = document.createElement('button');
                const specialClass = (idx === 4) ? 'sm:col-span-2 mx-auto w-full sm:w-[50%]' : 'w-full';
                btn.className = `btn-3d p-4 md:p-6 rounded-3xl text-white font-chewy text-2xl md:text-3xl text-left flex justify-between items-center shadow-lg hover:shadow-xl bg-gradient-to-r ${tema.color} ${specialClass} border-b-[6px] border-black/20`;
                btn.innerHTML = `<span>${tema.tema}</span> <i class="fas fa-chevron-right ml-2 text-white/50 text-xl"></i>`;
                btn.onclick = () => openTema(idx);
                grid.appendChild(btn);
            });
        }

        function openTema(temaIdx) {
            const temaData = dataKurikulum[temaIdx];
            document.getElementById('title-tema').innerText = temaData.tema;
            
            const grid = document.getElementById('unit-grid');
            grid.innerHTML = '';
            
            if (temaData.units && temaData.units.length > 0) {
                temaData.units.forEach((unit, idx) => {
                    const btn = document.createElement('button');
                    btn.className = `btn-3d w-full sm:w-[45%] md:w-[30%] bg-white rounded-3xl p-6 text-center border-4 border-gray-100 shadow-xl group hover:border-purple-300 flex flex-col items-center`;
                    btn.innerHTML = `
                        <div class="w-16 h-16 rounded-full flex items-center justify-center text-3xl font-chewy text-white bg-gradient-to-br ${temaData.color} mb-4 shadow-inner">${idx + 1}</div>
                        <div class="text-xl md:text-2xl font-bold text-gray-700 leading-snug">${unit.title}</div>
                    `;
                    btn.onclick = () => openUnit(temaIdx, idx);
                    grid.appendChild(btn);
                });
            } else {
                grid.innerHTML = `<div class="w-full text-center text-gray-500 font-bold p-10 bg-white rounded-3xl">Kandungan tema ini akan dikemas kini kelak!</div>`;
            }
            navigateTo('view-units');
        }

        function openUnit(temaIdx, unitIdx) {
            const unitData = dataKurikulum[temaIdx].units[unitIdx];
            document.getElementById('title-unit').innerText = unitData.title;
            
            const list = document.getElementById('activity-list');
            const ruangKosong = document.getElementById('ruang-kosong');
            list.innerHTML = '';
            
            if (unitData.activities && unitData.activities.length > 0) {
                ruangKosong.classList.add('hidden');
                list.classList.remove('hidden');
                
                unitData.activities.forEach((act, actIdx) => {
                    const btn = document.createElement('button');
                    btn.className = `btn-3d w-full bg-white p-5 rounded-2xl border-4 border-teal-100 flex items-center gap-4 hover:bg-teal-50 text-left shadow-md mb-3`;
                    btn.innerHTML = `
                        <div class="bg-teal-500 text-white w-14 h-14 rounded-xl flex items-center justify-center text-2xl shadow-inner"><i class="fas fa-play"></i></div>
                        <div class="font-bold text-xl md:text-2xl text-teal-800">${act.name}</div>
                    `;
                    btn.onclick = () => openActivity(temaIdx, unitIdx, actIdx);
                    list.appendChild(btn);
                });
            } else {
                list.classList.add('hidden');
                ruangKosong.classList.remove('hidden');
            }
            navigateTo('view-activities');
        }

        function openActivity(temaIdx, unitIdx, actIdx) {
            activeData = JSON.parse(JSON.stringify(dataKurikulum[temaIdx].units[unitIdx].activities[actIdx]));
            document.getElementById('play-title').innerText = activeData.name;
            
            stepIndex = 0;
            selectedIndex = null;
            
            // Format state berdasarkan jenis aktiviti
            if (activeData.type === 'padan' || activeData.type === 'padan-overlay') {
                activeData.poolState = activeData.pool.map((t, i) => ({ text: t, used: false, id: i }));
            } else if (activeData.type === 'kategori-inline') {
                activeData.pool.forEach((p, i) => { p.id = i; p.catId = null; });
            } else if (activeData.type === 'padan-3-kolum') {
                activeData.poolState = activeData.pool.map((t, i) => ({ text: t, used: false, id: i }));
                activeData.targetsNama = activeData.items.map(it => ({ ans: it.nama, placedId: undefined }));
                activeData.targetsPenjodoh = activeData.items.map(it => ({ ans: it.penjodoh, placedId: undefined }));
            }

            renderActivityView();
            navigateTo('view-play');
        }

        function renderActivityView() {
            const container = document.getElementById('play-container');
            container.innerHTML = '';
            
            if (activeData.type === 'mcq') renderMCQ(container);
            else if (activeData.type === 'padan') renderPadan(container);
            else if (activeData.type === 'padan-overlay') renderPadanOverlay(container);
            else if (activeData.type === 'kategori-inline') renderKategoriInline(container);
            else if (activeData.type === 'susun-ayat') renderSusunAyat(container);
            else if (activeData.type === 'padan-3-kolum') renderPadan3Kolum(container);
            else if (activeData.type === 'bacaan') renderBacaan(container);
            else if (activeData.type === 'isi-kosong') renderIsiKosong(container);
            else if (activeData.type === 'mcq-berkaitan') renderMCQBerkaitan(container);
        }

        function tapSelect(poolIndex) {
            selectedIndex = (selectedIndex === poolIndex) ? null : poolIndex; 
            renderActivityView();
        }

        function renderMCQ(container) {
            if (stepIndex >= activeData.items.length) { showCompletion(); return; }
            
            const q = activeData.items[stepIndex];
            
            let wrongOptions = activeData.pool.filter(opt => opt !== q.ans);
            wrongOptions = wrongOptions.sort(() => 0.5 - Math.random()).slice(0, 3);
            let options = [q.ans, ...wrongOptions].sort(() => 0.5 - Math.random());

            let mediaHtml = '';
            if (q.type === 'video') {
                mediaHtml = `<div class="bg-black p-2 rounded-xl mb-4 md:mb-0 w-full flex justify-center shadow-lg border-4 border-gray-200">
                                <video src="${q.media}" controls autoplay class="max-h-[40vh] max-w-full rounded-lg"></video>
                             </div>`;
            } else {
                mediaHtml = `<img src="${q.media}" alt="Soalan" class="max-h-[40vh] object-contain rounded-xl shadow-lg border-4 border-white mb-4 md:mb-0">`;
            }

            let html = `
                <div class="flex flex-col md:flex-row gap-6 items-center w-full max-w-5xl mx-auto">
                    <div class="w-full md:w-1/2 flex justify-center">
                        ${mediaHtml}
                    </div>
                    <div class="w-full md:w-1/2 grid grid-cols-1 gap-4">
            `;
            
            options.forEach((opt, idx) => {
                html += `<button onclick="checkMCQ(${idx})" class="btn-3d w-full bg-white border-4 border-blue-200 text-blue-800 font-bold p-4 md:p-5 rounded-2xl text-left text-lg md:text-xl hover:bg-blue-50 shadow-md">
                            ${opt}
                         </button>`;
            });
            
            html += `</div></div>
                     <div class="text-center mt-8 text-gray-500 font-bold bg-gray-100 rounded-full py-2 px-6 inline-block mx-auto text-lg border-2 border-gray-200">
                        Soalan ${stepIndex + 1} / ${activeData.items.length}
                     </div>`;
                     
            container.innerHTML = html;
            activeData.currentOptions = options; 
            activeData.currentAns = q.ans;
        }

        function renderMCQBerkaitan(container) {
            if (stepIndex >= activeData.items.length) { showCompletion(); return; }
            const item = activeData.items[stepIndex];
            
            let html = `<div class="w-full flex flex-col items-center max-w-4xl mx-auto">`;
            
            html += `<img src="${activeData.overallImage}" class="w-full md:max-w-2xl object-contain rounded-3xl shadow-xl border-4 border-white mb-6">`;
            html += `<div class="w-full bg-gradient-to-r from-blue-50 to-purple-50 p-6 md:p-8 rounded-3xl shadow-md border-4 border-purple-200 mb-6 text-center text-xl md:text-2xl font-bold text-purple-900">${item.q}</div>`;
            
            html += `<div class="w-full grid grid-cols-1 md:grid-cols-3 gap-4">`;
            let options = [...item.options].sort(() => 0.5 - Math.random());
            activeData.currentOptions = options;
            activeData.currentAns = item.ans;
            
            options.forEach((opt, idx) => {
                html += `<button onclick="checkMCQ(${idx})" class="btn-3d w-full bg-white border-4 border-blue-300 text-blue-800 font-bold p-4 md:p-5 rounded-2xl text-center text-lg hover:bg-blue-50 hover:border-blue-500 shadow-md">${opt}</button>`;
            });
            html += `</div>`;
            html += `<div class="text-center mt-8 text-gray-500 font-bold bg-gray-100 rounded-full py-2 px-6 inline-block text-lg border-2 border-gray-200">Soalan ${stepIndex + 1} / ${activeData.items.length}</div>`;
            html += `</div>`;
            container.innerHTML = html;
        }

        function checkMCQ(optIndex) {
            const selected = activeData.currentOptions[optIndex];
            const correct = activeData.currentAns;
            
            if (selected === correct) {
                stepIndex++;
                showFeedback(true, correct, selected, () => renderActivityView());
            } else {
                showFeedback(false, correct, selected, () => renderActivityView());
            }
        }

        function renderPadan(container) {
            const colClass = activeData.cols === 2 ? 'md:grid-cols-2' : (activeData.cols === 1 ? 'grid-cols-1' : 'md:grid-cols-3');
            let html = `<div class="grid grid-cols-2 ${colClass} gap-4 md:gap-6 mb-8 w-full">`;
            
            activeData.targets.forEach((t, i) => {
                const placedItem = t.placedId !== undefined ? activeData.poolState.find(p => p.id === t.placedId) : null;
                const isTargeted = selectedIndex !== null;
                const hoverClass = isTargeted ? 'border-rose-400 bg-rose-50 cursor-pointer animate-pulse' : 'border-gray-300 bg-gray-50';
                
                let contentHtml = '';
                if (t.image) {
                    contentHtml = `<img src="${t.image}" class="h-24 md:h-32 object-contain mx-auto mb-4 rounded-xl border-2 border-gray-100">`;
                } else if (t.text) {
                    contentHtml = `<div class="text-base md:text-xl font-bold text-center mb-4 text-gray-700 leading-snug">${t.text}</div>`;
                }
                
                html += `<div class="bg-white p-4 rounded-2xl shadow-lg border-4 border-gray-100 flex flex-col justify-between h-full">
                            ${contentHtml}`;
                            
                if (placedItem) {
                    html += `<div class="w-full bg-green-100 text-green-800 border-4 border-green-500 font-bold p-3 rounded-xl text-center text-lg md:text-xl shadow-sm">
                                <i class="fas fa-check-circle mr-2"></i>${placedItem.text}
                             </div>`;
                } else {
                    html += `<div onclick="tapPlace(${i})" class="w-full h-14 border-4 border-dashed rounded-xl flex items-center justify-center font-bold transition-all ${hoverClass}"></div>`;
                }
                html += `</div>`;
            });
            html += `</div>`;
            
            html += `<div class="bg-blue-50 p-6 rounded-3xl border-4 border-blue-200 shadow-inner w-full max-w-4xl"><h3 class="text-center font-bold text-blue-500 mb-4 text-xl tracking-wider">PILIHAN JAWAPAN</h3><div class="flex flex-wrap gap-3 justify-center">`;
            
            activeData.poolState.forEach((p, i) => {
                if (p.used) return;
                const isSelected = selectedIndex === i;
                const btnClass = isSelected ? 'bg-rose-500 text-white border-rose-600 scale-110 shadow-xl' : 'bg-white text-blue-800 border-blue-300 hover:bg-blue-100';
                html += `<button onclick="tapSelect(${i})" class="btn-3d border-b-4 font-bold p-3 md:p-4 rounded-xl text-lg md:text-xl transition-all ${btnClass}">${p.text}</button>`;
            });
            html += `</div></div>`;
            container.innerHTML = html;
        }

        function renderPadan3Kolum(container) {
            let html = `<div class="grid grid-cols-3 gap-2 md:gap-6 mb-8 w-full max-w-5xl items-stretch">`;
            html += `<div class="font-bold text-center text-rose-500 mb-2 text-xl md:text-2xl font-chewy">NAMA</div>
                     <div class="font-bold text-center text-blue-500 mb-2 text-xl md:text-2xl font-chewy">GAMBAR</div>
                     <div class="font-bold text-center text-teal-500 mb-2 text-xl md:text-2xl font-chewy">PENJODOH BILANGAN</div>`;

            activeData.items.forEach((item, i) => {
                const targetNama = activeData.targetsNama[i];
                const placedNama = targetNama.placedId !== undefined ? activeData.poolState.find(p => p.id === targetNama.placedId) : null;
                const hoverClassNama = selectedIndex !== null ? 'border-rose-400 bg-rose-50 cursor-pointer animate-pulse' : 'border-gray-300 bg-gray-50';
                
                html += `<div class="flex items-center justify-center h-full w-full">`;
                if (placedNama) {
                    html += `<div class="w-full p-2 md:p-4 bg-green-100 text-green-800 border-4 border-green-500 font-bold rounded-xl text-center shadow-md text-sm md:text-xl">${placedNama.text}</div>`;
                } else {
                    html += `<div onclick="tapPlace3Kolum('nama', ${i})" class="w-full h-16 md:h-20 border-4 border-dashed rounded-xl transition-all ${hoverClassNama}"></div>`;
                }
                html += `</div>`;

                html += `<div class="flex items-center justify-center bg-white rounded-2xl shadow-sm border-2 border-gray-100 p-2"><img src="${item.image}" class="h-16 md:h-24 object-contain"></div>`;

                const targetPenjodoh = activeData.targetsPenjodoh[i];
                const placedPenjodoh = targetPenjodoh.placedId !== undefined ? activeData.poolState.find(p => p.id === targetPenjodoh.placedId) : null;
                const hoverClassPenjodoh = selectedIndex !== null ? 'border-teal-400 bg-teal-50 cursor-pointer animate-pulse' : 'border-gray-300 bg-gray-50';
                
                html += `<div class="flex items-center justify-center h-full w-full">`;
                if (placedPenjodoh) {
                    html += `<div class="w-full p-2 md:p-4 bg-green-100 text-green-800 border-4 border-green-500 font-bold rounded-xl text-center shadow-md text-sm md:text-xl">${placedPenjodoh.text}</div>`;
                } else {
                    html += `<div onclick="tapPlace3Kolum('penjodoh', ${i})" class="w-full h-16 md:h-20 border-4 border-dashed rounded-xl transition-all ${hoverClassPenjodoh}"></div>`;
                }
                html += `</div>`;
            });
            html += `</div>`;

            html += `<div class="bg-blue-50 p-6 rounded-3xl border-4 border-blue-200 shadow-inner w-full max-w-4xl"><h3 class="text-center font-bold text-blue-500 mb-4 text-xl tracking-wider">PILIHAN JAWAPAN</h3><div class="flex flex-wrap gap-3 justify-center">`;
            activeData.poolState.forEach((p, i) => {
                if (p.used) return;
                const isSelected = selectedIndex === i;
                const btnClass = isSelected ? 'bg-rose-500 text-white border-rose-600 scale-110 shadow-xl' : 'bg-white text-blue-800 border-blue-300';
                html += `<button onclick="tapSelect(${i})" class="btn-3d border-b-4 font-bold p-3 md:p-4 rounded-xl text-lg md:text-xl transition-all ${btnClass}">${p.text}</button>`;
            });
            html += `</div></div>`;
            container.innerHTML = html;
        }

        function tapPlace3Kolum(type, index) {
            if (selectedIndex === null) return;
            const poolItem = activeData.poolState[selectedIndex];
            const targetList = type === 'nama' ? activeData.targetsNama : activeData.targetsPenjodoh;
            const target = targetList[index];

            if (poolItem.text === target.ans) {
                target.placedId = poolItem.id;
                poolItem.used = true;
                selectedIndex = null;
                renderActivityView();
                
                if (activeData.targetsNama.every(t => t.placedId !== undefined) && activeData.targetsPenjodoh.every(t => t.placedId !== undefined)) {
                    setTimeout(showCompletion, 600);
                }
            } else {
                selectedIndex = null;
                showFeedback(false, target.ans, poolItem.text, () => renderActivityView());
            }
        }

        function renderSusunAyat(container) {
            if (stepIndex >= activeData.items.length) { showCompletion(); return; }
            const item = activeData.items[stepIndex];
            
            if (!activeData.currentItem || activeData.currentItem.ans !== item.ans) {
                activeData.currentItem = item;
                const correctWords = item.ans.trim().split(/\s+/);
                activeData.targets = correctWords.map(w => ({ ans: w, placedId: undefined }));
                let shuffledWords = [...correctWords].sort(() => 0.5 - Math.random());
                activeData.poolState = shuffledWords.map((w, i) => ({ text: w, used: false, id: i }));
            }

            let html = `<div class="w-full max-w-4xl mx-auto flex flex-col items-center">`;
            html += `<img src="${item.media}" class="max-h-[40vh] object-contain rounded-2xl shadow-xl border-4 border-white mb-8">`;
            
            html += `<div class="flex flex-wrap gap-2 justify-center w-full mb-8 bg-blue-50 p-6 rounded-3xl shadow-inner border-4 border-blue-100 min-h-[100px] items-center">`;
            activeData.targets.forEach((t, i) => {
                const placedItem = t.placedId !== undefined ? activeData.poolState.find(p => p.id === t.placedId) : null;
                if (placedItem) {
                    html += `<div class="p-3 md:p-4 bg-green-100 text-green-800 border-4 border-green-500 font-bold rounded-xl shadow-md text-lg md:text-xl">${placedItem.text}</div>`;
                } else {
                    const hoverClass = selectedIndex !== null ? 'border-rose-400 bg-rose-50 cursor-pointer animate-pulse' : 'border-gray-300 bg-white';
                    html += `<div onclick="tapPlaceSusun(${i})" class="h-14 md:h-16 w-24 md:w-28 border-4 border-dashed rounded-xl transition-all ${hoverClass}"></div>`;
                }
            });
            html += `</div>`;

            html += `<div class="flex flex-wrap gap-3 justify-center w-full">`;
            activeData.poolState.forEach((p, i) => {
                if (p.used) return;
                const isSelected = selectedIndex === i;
                const btnClass = isSelected ? 'bg-rose-500 text-white border-rose-600 scale-110 shadow-xl' : 'bg-white text-blue-700 border-blue-300 hover:bg-blue-50';
                html += `<button onclick="tapSelect(${i})" class="btn-3d border-b-4 font-bold p-3 md:p-4 rounded-xl text-lg md:text-xl transition-all ${btnClass}">${p.text}</button>`;
            });
            html += `</div>`;
            html += `<div class="text-center mt-8 text-gray-500 font-bold bg-gray-100 rounded-full py-2 px-6 inline-block text-lg border-2 border-gray-200">Soalan ${stepIndex + 1} / ${activeData.items.length}</div>`;
            html += `</div>`;
            container.innerHTML = html;
        }

        function tapPlaceSusun(targetIndex) {
            if (selectedIndex === null) return;
            const poolItem = activeData.poolState[selectedIndex];
            const target = activeData.targets[targetIndex];

            if (poolItem.text === target.ans) {
                target.placedId = poolItem.id;
                poolItem.used = true;
                selectedIndex = null;
                renderActivityView();
                
                if (activeData.targets.every(t => t.placedId !== undefined)) {
                    setTimeout(() => {
                        stepIndex++;
                        renderActivityView();
                    }, 1200);
                }
            } else {
                selectedIndex = null;
                showFeedback(false, target.ans, poolItem.text, () => renderActivityView());
            }
        }

        function renderIsiKosong(container) {
            if (stepIndex >= activeData.items.length) { showCompletion(); return; }
            const item = activeData.items[stepIndex];
            
            if (!activeData.currentItem || activeData.currentItem.ans !== item.ans) {
                activeData.currentItem = item;
                activeData.poolState = activeData.pool.map((w, i) => ({ text: w, used: false, id: i }));
                activeData.target = { ans: item.ans, placedId: undefined };
            }

            let html = `<div class="flex flex-col md:flex-row gap-8 items-center w-full max-w-5xl mx-auto">`;
            html += `<div class="w-full md:w-1/2 flex justify-center"><img src="${item.media}" class="max-h-[45vh] object-contain rounded-2xl shadow-xl border-4 border-white"></div>`;
            
            html += `<div class="w-full md:w-1/2 flex flex-col gap-6 items-center">`;
            
            const placedItem = activeData.target.placedId !== undefined ? activeData.poolState.find(p => p.id === activeData.target.placedId) : null;
            let blankHtml = '';
            if (placedItem) {
                 blankHtml = `<span class="px-4 py-2 mx-2 bg-green-100 text-green-800 border-b-4 border-green-500 font-bold rounded-xl inline-block shadow-sm">${placedItem.text}</span>`;
            } else {
                 const hoverClass = selectedIndex !== null ? 'border-rose-400 bg-rose-50 cursor-pointer animate-pulse' : 'border-gray-400 bg-gray-100';
                 blankHtml = `<span onclick="tapPlaceIsiKosong()" class="px-10 py-4 mx-2 border-b-4 border-dashed rounded-xl inline-block transition-all ${hoverClass}"></span>`;
            }

            let sentenceHtml = item.ayat.replace(/_+/, blankHtml);
            html += `<div class="text-2xl md:text-3xl font-bold text-gray-700 bg-white p-8 rounded-3xl shadow-lg border-4 border-blue-100 leading-relaxed text-center w-full">${sentenceHtml}</div>`;

            html += `<div class="flex flex-wrap gap-3 justify-center w-full bg-blue-50 p-6 rounded-3xl border-4 border-blue-200 shadow-inner">`;
            activeData.poolState.forEach((p, i) => {
                if (p.used && p.text === activeData.target.ans && activeData.target.placedId === p.id) return;
                const isSelected = selectedIndex === i;
                const btnClass = isSelected ? 'bg-rose-500 text-white border-rose-600 scale-110 shadow-xl' : 'bg-white text-blue-700 border-blue-300 hover:bg-blue-100';
                html += `<button onclick="tapSelect(${i})" class="btn-3d border-b-4 font-bold p-3 md:p-4 rounded-xl text-lg md:text-xl transition-all ${btnClass}">${p.text}</button>`;
            });
            html += `</div>`;
            html += `<div class="text-center mt-4 text-gray-500 font-bold bg-gray-100 rounded-full py-2 px-6 inline-block text-lg border-2 border-gray-200">Soalan ${stepIndex + 1} / ${activeData.items.length}</div>`;
            html += `</div></div>`;
            
            container.innerHTML = html;
        }

        function tapPlaceIsiKosong() {
            if (selectedIndex === null) return;
            const poolItem = activeData.poolState[selectedIndex];
            
            if (poolItem.text === activeData.target.ans) {
                activeData.target.placedId = poolItem.id;
                selectedIndex = null;
                renderActivityView();
                setTimeout(() => { stepIndex++; renderActivityView(); }, 1200);
            } else {
                selectedIndex = null;
                showFeedback(false, activeData.target.ans, poolItem.text, () => renderActivityView());
            }
        }

        function renderBacaan(container) {
            let html = `<div class="w-full flex flex-col items-center gap-8">
                <img src="${activeData.image}" class="max-w-full md:max-w-3xl rounded-3xl shadow-2xl border-4 border-white">
                <button onclick="showCompletion()" class="btn-3d bg-green-500 hover:bg-green-400 text-white font-chewy text-3xl py-4 px-12 rounded-3xl border-b-[6px] border-green-700 shadow-xl bounce-in">
                    Selesai Membaca!
                </button>
            </div>`;
            container.innerHTML = html;
        }

        function renderPadanOverlay(container) {
            let html = `<div class="relative w-full max-w-4xl mx-auto mb-8 border-4 border-white shadow-2xl rounded-2xl overflow-hidden bg-white">
                            <img src="${activeData.image}" class="w-full h-auto block select-none pointer-events-none">`;
            
            activeData.targets.forEach((t, i) => {
                const placedItem = t.placedId !== undefined ? activeData.poolState.find(p => p.id === t.placedId) : null;
                const isTargeted = selectedIndex !== null;
                
                html += `<div class="absolute" style="top: ${t.top}%; left: ${t.left}%; width: ${t.w}%; height: ${t.h}%;">`;
                
                if (placedItem) {
                    html += `<div class="w-full h-full bg-green-100 text-green-800 border-4 border-green-600 font-bold flex items-center justify-center text-[10px] md:text-base shadow-lg overflow-hidden p-1 text-center leading-tight rounded-xl">
                                ${placedItem.text}
                             </div>`;
                } else {
                    const hoverClass = isTargeted ? 'border-rose-500 bg-rose-300/60 animate-pulse ring-4 ring-rose-300 cursor-pointer' : 'border-gray-800 border-dashed bg-white/40';
                    html += `<div onclick="tapPlace(${i})" class="w-full h-full border-4 rounded-xl shadow-md backdrop-blur-sm transition-all ${hoverClass}"></div>`;
                }
                html += `</div>`;
            });
            
            html += `</div>`;
            html += `<div class="flex flex-wrap gap-3 justify-center w-full max-w-4xl mx-auto bg-blue-50 p-6 rounded-3xl border-4 border-blue-200 shadow-inner">`;
            activeData.poolState.forEach((p, i) => {
                if (p.used) return;
                const isSelected = selectedIndex === i;
                const btnClass = isSelected ? 'bg-rose-500 text-white border-rose-600 scale-110 shadow-xl' : 'bg-white text-blue-800 border-blue-300 hover:bg-blue-100';
                html += `<button onclick="tapSelect(${i})" class="btn-3d border-b-4 font-bold p-3 md:p-4 rounded-xl text-lg md:text-xl transition-all ${btnClass}">${p.text}</button>`;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        function tapPlace(targetIndex) {
            if (selectedIndex === null) return;
            const poolItem = activeData.poolState[selectedIndex];
            const target = activeData.targets[targetIndex];
            
            if (poolItem.text === target.ans) {
                target.placedId = poolItem.id;
                poolItem.used = true;
                selectedIndex = null;
                renderActivityView();
                
                if (activeData.targets.every(t => t.placedId !== undefined)) {
                    setTimeout(showCompletion, 600);
                }
            } else {
                selectedIndex = null;
                showFeedback(false, target.ans, poolItem.text, () => renderActivityView());
            }
        }

        function renderKategoriInline(container) {
            let html = `<div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full mb-8">`;
            activeData.categories.forEach(cat => {
                const itemsInCat = activeData.pool.filter(p => p.catId === cat.id);
                html += `<div class="bg-white border-4 border-purple-200 rounded-3xl p-6 shadow-xl min-h-[250px] flex flex-col">
                            <h3 class="text-2xl font-chewy text-purple-600 text-center border-b-4 border-dashed border-purple-100 pb-3 mb-4">${cat.name}</h3>
                            <div onclick="tapPlaceKategori('${cat.id}')" class="flex-grow flex flex-col gap-3 rounded-2xl p-4 ${selectedIndex !== null ? 'bg-purple-50 border-4 border-dashed border-purple-400 cursor-pointer animate-pulse' : 'bg-gray-50 border-4 border-dashed border-transparent'} transition-colors">
                            `;
                            
                itemsInCat.forEach(item => {
                    let styleClass = 'bg-blue-100 text-blue-800 border-blue-300';
                    let icon = '';
                    if (activeData.isChecked) {
                        const isCorrect = item.ans === cat.id;
                        styleClass = isCorrect ? 'bg-green-100 text-green-800 border-green-500 shadow-md' : 'bg-red-50 text-red-500 border-red-300 line-through opacity-80';
                        icon = isCorrect ? '<i class="fas fa-check-circle text-green-600 mr-2"></i>' : '<i class="fas fa-times-circle text-red-500 mr-2"></i>';
                    }
                    html += `<div onclick="kembalikanItemKategori(${item.id}); event.stopPropagation();" class="p-3 border-4 rounded-xl font-bold text-center cursor-pointer text-lg ${styleClass}">
                                ${icon}${item.text}
                             </div>`;
                });
                
                html += `   </div></div>`;
            });
            html += `</div>`;
            
            if (!activeData.isChecked && activeData.pool.every(p => p.catId !== null)) {
                html += `<button onclick="semakKategori()" class="btn-3d w-full max-w-sm mx-auto mb-8 bg-yellow-400 text-yellow-900 font-chewy text-3xl py-4 rounded-3xl border-b-[6px] border-yellow-600 shadow-xl block">
                            Semak Jawapan
                         </button>`;
            } else if (activeData.isChecked) {
                html += `<button onclick="showCompletion()" class="btn-3d w-full max-w-sm mx-auto mb-8 bg-blue-500 text-white font-chewy text-3xl py-4 rounded-3xl border-b-[6px] border-blue-700 shadow-xl block bounce-in">
                            Selesai Seterusnya!
                         </button>`;
            }

            if (!activeData.isChecked) {
                html += `<div class="flex flex-wrap gap-3 justify-center w-full max-w-4xl mx-auto bg-blue-50 p-6 rounded-3xl border-4 border-blue-200 shadow-inner">`;
                activeData.pool.forEach((p) => {
                    if (p.catId !== null) return;
                    const isSelected = selectedIndex === p.id;
                    const btnClass = isSelected ? 'bg-rose-500 text-white border-rose-600 scale-110 shadow-xl' : 'bg-white text-blue-800 border-blue-300 hover:bg-blue-100';
                    html += `<button onclick="tapSelect(${p.id})" class="btn-3d border-b-4 font-bold p-3 md:p-4 rounded-xl text-lg md:text-xl transition-all ${btnClass}">${p.text}</button>`;
                });
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        function tapPlaceKategori(catId) {
            if (selectedIndex === null || activeData.isChecked) return;
            const item = activeData.pool.find(p => p.id === selectedIndex);
            item.catId = catId;
            selectedIndex = null;
            renderActivityView();
        }
        function kembalikanItemKategori(itemId) {
            if (activeData.isChecked) return;
            const item = activeData.pool.find(p => p.id === itemId);
            item.catId = null;
            renderActivityView();
        }
        function semakKategori() {
            activeData.isChecked = true;
            renderActivityView();
        }

        function showFeedback(isCorrect, rightAns, wrongAns, callback) {
            const modal = document.getElementById('modal-feedback');
            const icon = document.getElementById('feedback-icon');
            const title = document.getElementById('feedback-title');
            const msg = document.getElementById('feedback-message');
            const btn = document.getElementById('btn-next');
            
            if (isCorrect) {
                icon.innerHTML = '<span class="text-green-500 drop-shadow-md">🌟</span>';
                title.innerText = 'Syabas!';
                title.className = 'text-5xl font-chewy text-green-500 mb-4 drop-shadow-sm';
                msg.innerHTML = 'Hebat! Jawapan anda tepat sekali.';
            } else {
                icon.innerHTML = '<span class="text-rose-500 drop-shadow-md">💡</span>';
                title.innerText = 'Cuba Lagi!';
                title.className = 'text-5xl font-chewy text-rose-500 mb-4 drop-shadow-sm';
                msg.innerHTML = `Jawapan anda kurang tepat.<br><br><span class="text-base text-gray-400">Jawapan sebenar:</span><br><span class="text-blue-600 text-2xl font-bold bg-blue-50 p-2 rounded-lg inline-block mt-2 border-2 border-blue-100">${rightAns}</span>`;
            }
            
            btn.onclick = () => {
                modal.classList.add('hidden');
                if (callback) callback();
            };
            modal.classList.remove('hidden');
        }

        function showCompletion() {
            const modal = document.getElementById('modal-feedback');
            document.getElementById('feedback-icon').innerHTML = '<span class="drop-shadow-lg">🏆</span>';
            const title = document.getElementById('feedback-title');
            title.innerText = 'Tahniah!';
            title.className = 'text-5xl font-chewy text-yellow-500 mb-4 drop-shadow-sm';
            
            document.getElementById('feedback-message').innerHTML = `Anda telah berjaya melengkapkan aktiviti ini dengan cemerlang!`;
            
            const btnNext = document.getElementById('btn-next');
            btnNext.innerText = 'Kembali ke Unit';
            btnNext.onclick = () => {
                modal.classList.add('hidden');
                goBack();
            };
            modal.classList.remove('hidden');
        }

        // Init App on load
        window.onload = initApp;

    </script>
</body>
</html>
