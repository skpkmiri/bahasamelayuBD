        .btn-3d:active { transform: translateY(4px); box-shadow: 0 0px 0 transparent !important; }

        .bounce-in { animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        let navHistory = ['view-home'];
        let activeData = null; 
        let stepIndex = 0; 
        let selectedIndex = null; 

        function navigateTo(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
            
            navHistory.push(viewId);
            updateNavButtons();
            
            const banner = document.getElementById('main-banner');
            if (viewId === 'view-home') banner.classList.remove('hidden');
            else banner.classList.add('hidden');
        }

        function goBack() {
            if (navHistory.length > 1) {
                navHistory.pop(); 
                const prev = navHistory[navHistory.length - 1];
                
                document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
                document.getElementById(prev).classList.remove('hidden');
                
                updateNavButtons();
                const banner = document.getElementById('main-banner');
                if (prev === 'view-home') banner.classList.remove('hidden');
                else banner.classList.add('hidden');
            }
        }

        function goHome() {
            window.location.href = 'index.html';
        }

        function updateNavButtons() {
            const btnBack = document.getElementById('btn-back');
            if (navHistory.length > 1) btnBack.classList.remove('hidden');
            else btnBack.classList.add('hidden');
        }

        function isImage(text) {
            return /\.(jpeg|jpg|gif|png|webp)(\?.*)?$/i.test(String(text).trim());
        }

        function initApp() {
            const grid = document.getElementById('tema-grid');
            grid.innerHTML = '';
            
            dataKurikulum.forEach((tema, idx) => {
                const btn = document.createElement('button');
                const specialClass = (idx === 4) ? 'sm:col-span-2 mx-auto w-full sm:w-[50%]' : 'w-full';
                btn.className = `btn-3d p-4 md:p-6 rounded-3xl text-white font-chewy text-2xl md:text-3xl text-left flex justify-between items-center shadow-lg hover:shadow-xl bg-gradient-to-r ${tema.color} ${specialClass} border-b-[6px] border-black/20`;
                btn.innerHTML = `<span>${tema.tema}</span> <i class="fas fa-chevron-right ml-2 text-white/50 text-xl"></i>`;
                btn.onclick = () => openTema(idx);
                grid.appendChild(btn);
            });
        }

        function openTema(temaIdx) {
            const temaData = dataKurikulum[temaIdx];
            document.getElementById('title-tema').innerText = temaData.tema;
            
            const grid = document.getElementById('unit-grid');
            grid.innerHTML = '';
            
            if (temaData.units && temaData.units.length > 0) {
                temaData.units.forEach((unit, idx) => {
                    const btn = document.createElement('button');
                    btn.className = `btn-3d w-full sm:w-[45%] md:w-[30%] bg-white rounded-3xl p-6 text-center border-4 border-gray-100 shadow-xl group hover:border-purple-300 flex flex-col items-center`;
                    btn.innerHTML = `
                        <div class="w-16 h-16 rounded-full flex items-center justify-center text-3xl font-chewy text-white bg-gradient-to-br ${temaData.color} mb-4 shadow-inner">${idx + 1}</div>
                        <div class="text-xl md:text-2xl font-bold text-gray-700 leading-snug">${unit.title}</div>
                    `;
                    btn.onclick = () => openUnit(temaIdx, idx);
                    grid.appendChild(btn);
                });
            } else {
                grid.innerHTML = `<div class="w-full text-center text-gray-500 font-bold p-10 bg-white rounded-3xl">Kandungan tema ini akan dikemas kini kelak!</div>`;
            }
            navigateTo('view-units');
        }

        function openUnit(temaIdx, unitIdx) {
            const unitData = dataKurikulum[temaIdx].units[unitIdx];
            document.getElementById('title-unit').innerText = unitData.title;
            
            const list = document.getElementById('activity-list');
            const ruangKosong = document.getElementById('ruang-kosong');
            list.innerHTML = '';
            
            if (unitData.activities && unitData.activities.length > 0) {
                ruangKosong.classList.add('hidden');
                list.classList.remove('hidden');
                
                unitData.activities.forEach((act, actIdx) => {
                    const btn = document.createElement('button');
                    btn.className = `btn-3d w-full bg-white p-5 rounded-2xl border-4 border-teal-100 flex items-center gap-4 hover:bg-teal-50 text-left shadow-md mb-3`;
                    btn.innerHTML = `
                        <div class="bg-teal-500 text-white w-14 h-14 rounded-xl flex items-center justify-center text-2xl shadow-inner"><i class="fas fa-play"></i></div>
                        <div class="font-bold text-xl md:text-2xl text-teal-800">${act.name}</div>
                    `;
                    btn.onclick = () => openActivity(temaIdx, unitIdx, actIdx);
                    list.appendChild(btn);
                });
            } else {
                list.classList.add('hidden');
                ruangKosong.classList.remove('hidden');
            }
            navigateTo('view-activities');
        }

        function openActivity(temaIdx, unitIdx, actIdx) {
            activeData = JSON.parse(JSON.stringify(dataKurikulum[temaIdx].units[unitIdx].activities[actIdx]));
            document.getElementById('play-title').innerText = activeData.name;
            
            stepIndex = 0;
            selectedIndex = null;
            
            if (activeData.type === 'padan' || activeData.type === 'padan-overlay' || activeData.type === 'isi-kosong-perenggan') {
                activeData.poolState = [...activeData.pool].sort(() => 0.5 - Math.random()).map((t, i) => ({ text: t, used: false, id: i }));
            } else if (activeData.type === 'kategori-inline') {
                activeData.pool.forEach((p, i) => { p.id = i; p.catId = null; });
            } else if (activeData.type === 'padan-3-kolum') {
                activeData.poolState = activeData.pool.map((t, i) => ({ text: t, used: false, id: i })).sort(() => 0.5 - Math.random());
                activeData.targetsNama = activeData.items.map(it => ({ ans: it.nama, placedId: undefined }));
                activeData.targetsPenjodoh = activeData.items.map(it => ({ ans: it.penjodoh, placedId: undefined }));
            }

            if (activeData.type === 'isi-kosong' && activeData.items) {
                activeData.items = activeData.items.sort(() => 0.5 - Math.random());
            }

            renderActivityView();
            navigateTo('view-play');
        }

        function getInstruction(type) {
            switch(type) {
                case 'mcq': return "Pilih satu jawapan yang paling tepat.";
                case 'mcq-berkaitan': return "Pilih jawapan yang betul berdasarkan maklumat yang diberikan.";
                case 'padan': return "Klik pilihan jawapan di bawah, kemudian klik pada petak kosong yang sepadan. Klik semula jawapan untuk menukarnya jika tersalah jawab.";
                case 'padan-overlay': return "Klik pilihan jawapan, kemudian letakkan ke dalam petak kosong pada gambar. Klik semula jawapan untuk menukarnya jika tersalah jawab.";
                case 'padan-3-kolum': return "Klik pilihan jawapan, kemudian susun ke dalam lajur yang betul. Klik semula untuk menukar jawapan jika tersilap.";

                case 'isi-kosong': return "Klik pilihan jawapan, kemudian klik pada tempat kosong pada ayat. Klik semula jawapan untuk membatalkan pilihan.";
                case 'isi-kosong-perenggan': return "Klik pilihan jawapan, kemudian klik pada tempat kosong di dalam petikan. Klik semula sekiranya ingin membetulkan kesilapan.";
                case 'hotspot-klik': return "Klik pada bahagian gambar yang betul berdasarkan soalan yang diberikan.";
                case 'word-search': return "Klik pada huruf-huruf bersebelahan di dalam grid untuk mencari perkataan tersembunyi.";
                case 'salin-menaip': return "Taip semula petikan di atas ke dalam ruangan yang disediakan dengan ejaan yang betul.";
                default: return "Selesaikan tugasan interaktif di bawah.";
            }
        }

        function renderActivityView() {
            const container = document.getElementById('play-container');
            container.innerHTML = '';
            
            const arahanHTML = `
                <div class="w-full text-center mb-6 fade-in">
                    <div class="inline-block bg-yellow-100 text-yellow-900 font-bold text-sm md:text-lg px-6 py-2 rounded-full border-4 border-yellow-300 shadow-md">
                        <i class="fas fa-lightbulb mr-2 animate-pulse text-yellow-600"></i>
                        <span class="font-chewy tracking-wide text-yellow-700">ARAHAN:</span> ${getInstruction(activeData.type)}
                    </div>
                </div>`;
            container.innerHTML = arahanHTML;

            const contentContainer = document.createElement('div');
            contentContainer.className = "w-full flex-grow flex flex-col justify-center items-center";
            container.appendChild(contentContainer);
            
            if (activeData.type === 'mcq') renderMCQ(contentContainer);
            else if (activeData.type === 'padan') renderPadan(contentContainer);
            else if (activeData.type === 'padan-overlay') renderPadanOverlay(contentContainer);
            else if (activeData.type === 'kategori-inline') renderKategoriInline(contentContainer);
            else if (activeData.type === 'susun-ayat') renderSusunAyat(contentContainer);
            else if (activeData.type === 'padan-3-kolum') renderPadan3Kolum(contentContainer);
            else if (activeData.type === 'bacaan') renderBacaan(contentContainer);
            else if (activeData.type === 'isi-kosong') renderIsiKosong(contentContainer);
            else if (activeData.type === 'mcq-berkaitan') renderMCQBerkaitan(contentContainer);
            else if (activeData.type === 'hotspot-klik') renderHotspotKlik(contentContainer);
            else if (activeData.type === 'isi-kosong-perenggan') renderIsiKosongPerenggan(contentContainer);
            else if (activeData.type === 'word-search') renderWordSearch(contentContainer);
            else if (activeData.type === 'salin-menaip') renderSalinMenaip(contentContainer);
        }

        function tapSelect(poolIndex) {
            selectedIndex = (selectedIndex === poolIndex) ? null : poolIndex; 
            renderActivityView();
        }

        function renderMCQ(container) {
            const q = activeData.items[stepIndex];
            if (!activeData.currentOptions || activeData.currentQ !== stepIndex) {
                let wrongOptions = activeData.pool.filter(opt => opt !== q.ans);
                wrongOptions = wrongOptions.sort(() => 0.5 - Math.random()).slice(0, 3);
                activeData.currentOptions = [q.ans, ...wrongOptions].sort(() => 0.5 - Math.random());
                activeData.currentAns = q.ans;
                activeData.currentQ = stepIndex;
            }

            let mediaHtml = '';
            if (q.type === 'video') mediaHtml = `<video src="${q.media}" controls autoplay class="max-h-[40vh] w-full object-cover rounded-2xl border-4 border-gray-200"></video>`;
            else mediaHtml = `<img src="${q.media}" class="max-h-[40vh] object-contain rounded-2xl border-4 border-white shadow-md">`;

            let html = `
                <div class="flex flex-col md:flex-row gap-6 items-center w-full max-w-5xl mx-auto">
                    <div class="w-full md:w-1/2 flex justify-center bg-gray-100/50 p-4 rounded-3xl shadow-inner">${mediaHtml}</div>
                    <div class="w-full md:w-1/2 grid grid-cols-1 gap-4">
            `;
            activeData.currentOptions.forEach((opt, idx) => {
                html += `<button onclick="checkMCQ(${idx})" class="btn-3d w-full bg-white border-4 border-blue-200 text-blue-800 font-bold p-4 md:p-5 rounded-2xl text-left text-lg md:text-xl hover:bg-blue-50 shadow-md transition-colors">${opt}</button>`;
            });
            html += `</div></div><div class="text-center mt-8 text-gray-500 font-bold bg-gray-100 rounded-full py-2 px-6 inline-block mx-auto text-lg border-2 border-gray-200">Soalan ${stepIndex + 1} / ${activeData.items.length}</div>`;
            container.innerHTML = html;
        }

        function checkMCQ(optIdx) {
            const selectedSafe = activeData.currentOptions[optIdx];
            const correct = activeData.currentAns;
            if (selectedSafe === correct) {
                showFeedback(true, correct, selectedSafe, () => { 
                    stepIndex++; 
                    if (stepIndex >= activeData.items.length) { stepIndex--; paparTamatAktiviti(); }
                    else renderActivityView(); 
                });
            } else {
                showFeedback(false, correct, selectedSafe, () => renderActivityView());
            }
        }

        function renderMCQBerkaitan(container) {
            const item = activeData.items[stepIndex];
            if (!activeData.currentOptions || activeData.currentQ !== stepIndex) {
                activeData.currentOptions = [...item.options].sort(() => 0.5 - Math.random());
                activeData.currentAns = item.ans;
                activeData.currentQ = stepIndex;
                activeData.multiSelected = []; 
            }
            
            let html = '';
            if (activeData.layOutFormat === 'vertical') {
                html += `<div class="flex flex-col gap-6 lg:gap-8 items-center w-full max-w-6xl mx-auto">`;
                html += `<div class="w-full flex justify-center bg-gray-50/50 p-3 md:p-5 rounded-3xl shadow-inner border-4 border-gray-200">
                            <img src="${activeData.overallImage}" class="w-full max-w-3xl max-h-[45vh] lg:max-h-[60vh] object-contain rounded-2xl shadow-sm bg-white">
                         </div>`;
                html += `<div class="w-full max-w-4xl flex flex-col gap-4">`;
                html += `<div class="w-full bg-gradient-to-r from-blue-50 to-purple-50 p-5 md:p-6 rounded-3xl shadow-md border-4 border-purple-200 text-center text-xl md:text-2xl font-bold text-purple-900 leading-snug">${item.q}</div>`;
                
                const areOptionsShort = activeData.currentOptions.every(opt => opt.length < 25);
                const optionsLayoutClass = areOptionsShort ? 'flex flex-row flex-wrap justify-center gap-4' : 'flex flex-col gap-4';
                html += `<div class="w-full ${optionsLayoutClass}">`;
                activeData.currentOptions.forEach((opt, idx) => {
                    if (item.type === 'multi') {
                        const isSelected = activeData.multiSelected.includes(opt);
                        const btnClass = isSelected ? 'bg-rose-500 text-white border-rose-600 scale-[1.02] shadow-xl' : 'bg-white text-blue-800 border-blue-300 hover:bg-blue-50';
                        const icon = isSelected ? '<i class="fas fa-check-circle mr-3 text-2xl drop-shadow-md flex-shrink-0"></i>' : '<i class="far fa-circle mr-3 text-2xl opacity-50 flex-shrink-0"></i>';
                        const widthClass = areOptionsShort ? 'flex-1 min-w-[200px] text-center justify-center' : 'w-full text-left';
                        html += `<button onclick="toggleMultiMCQ(${idx})" class="btn-3d ${widthClass} border-4 font-bold p-4 md:p-5 rounded-2xl text-lg md:text-xl transition-all flex items-center ${btnClass}">${icon}<span>${opt}</span></button>`;
                    } else {
                        const widthClass = areOptionsShort ? 'flex-1 min-w-[200px] text-center justify-center' : 'w-full text-left';
                        html += `<button onclick="checkMCQ(${idx})" class="btn-3d ${widthClass} bg-white border-4 border-blue-300 text-blue-800 font-bold p-4 md:p-5 rounded-2xl text-lg md:text-xl hover:bg-blue-50 shadow-md transition-colors flex items-center justify-center">${opt}</button>`;
                    }
                });
                html += `</div>`;
                
                if (item.type === 'multi') {
                    const isReady = activeData.multiSelected.length === item.reqCount;
                    html += `<div class="mt-4 flex flex-col items-center bg-blue-50 p-5 rounded-3xl border-4 border-blue-200 w-full shadow-inner">
                                <div class="text-xl font-bold text-gray-700 mb-3">Pilihan Semasa: <span class="${isReady ? 'text-green-600 text-2xl' : 'text-rose-500 text-2xl'}">${activeData.multiSelected.length} / ${item.reqCount}</span></div>
                                <button onclick="checkMultiMCQ()" class="btn-3d w-full bg-yellow-400 text-yellow-900 font-chewy text-2xl py-3 px-8 rounded-2xl border-b-[6px] border-yellow-600 shadow-lg transition-all ${isReady ? 'animate-bounce hover:bg-yellow-300' : 'opacity-50 cursor-not-allowed grayscale'}" ${isReady ? '' : 'disabled'}>Semak Jawapan!</button>
                             </div>`;
                }
                html += `<div class="text-center mt-6 text-gray-500 font-bold bg-gray-100 rounded-full py-2 px-6 inline-block mx-auto text-lg border-2 border-gray-200">Soalan ${stepIndex + 1} / ${activeData.items.length}</div>`;
                html += `</div></div>`;
            } else {
                html += `<div class="flex flex-col lg:flex-row gap-6 lg:gap-8 items-start w-full max-w-6xl mx-auto">`;
                html += `<div class="w-full lg:w-1/2 flex justify-center bg-gray-50/50 p-3 md:p-5 rounded-3xl shadow-inner border-4 border-gray-200 sticky top-4">
                            <img src="${activeData.overallImage}" class="w-full max-h-[45vh] lg:max-h-[70vh] object-contain rounded-2xl shadow-sm bg-white">
                         </div>`;
                html += `<div class="w-full lg:w-1/2 flex flex-col gap-4">`;
                html += `<div class="w-full bg-gradient-to-r from-blue-50 to-purple-50 p-5 md:p-6 rounded-3xl shadow-md border-4 border-purple-200 text-center text-xl md:text-2xl font-bold text-purple-900 leading-snug">${item.q}</div>`;
                html += `<div class="w-full flex flex-col gap-4">`;
                activeData.currentOptions.forEach((opt, idx) => {
                    if (item.type === 'multi') {
                        const isSelected = activeData.multiSelected.includes(opt);
                        const btnClass = isSelected ? 'bg-rose-500 text-white border-rose-600 scale-[1.02] shadow-xl' : 'bg-white text-blue-800 border-blue-300 hover:bg-blue-50';
                        const icon = isSelected ? '<i class="fas fa-check-circle mr-3 text-2xl drop-shadow-md flex-shrink-0"></i>' : '<i class="far fa-circle mr-3 text-2xl opacity-50 flex-shrink-0"></i>';
                        html += `<button onclick="toggleMultiMCQ(${idx})" class="btn-3d w-full border-4 font-bold p-4 md:p-5 rounded-2xl text-left text-lg md:text-xl transition-all flex items-center ${btnClass}">${icon}<span>${opt}</span></button>`;
                    } else {
                        html += `<button onclick="checkMCQ(${idx})" class="btn-3d w-full bg-white border-4 border-blue-300 text-blue-800 font-bold p-4 md:p-5 rounded-2xl text-left text-lg md:text-xl hover:bg-blue-50 shadow-md transition-colors">${opt}</button>`;
                    }
                });
                html += `</div>`;
                if (item.type === 'multi') {
                    const isReady = activeData.multiSelected.length === item.reqCount;
                    html += `<div class="mt-4 flex flex-col items-center bg-blue-50 p-5 rounded-3xl border-4 border-blue-200 w-full shadow-inner">
                                <div class="text-xl font-bold text-gray-700 mb-3">Pilihan Semasa: <span class="${isReady ? 'text-green-600 text-2xl' : 'text-rose-500 text-2xl'}">${activeData.multiSelected.length} / ${item.reqCount}</span></div>
                                <button onclick="checkMultiMCQ()" class="btn-3d w-full bg-yellow-400 text-yellow-900 font-chewy text-2xl py-3 px-8 rounded-2xl border-b-[6px] border-yellow-600 shadow-lg transition-all ${isReady ? 'animate-bounce hover:bg-yellow-300' : 'opacity-50 cursor-not-allowed grayscale'}" ${isReady ? '' : 'disabled'}>Semak Jawapan!</button>
                             </div>`;
                }
                html += `<div class="text-center mt-6 text-gray-500 font-bold bg-gray-100 rounded-full py-2 px-6 inline-block mx-auto text-lg border-2 border-gray-200">Soalan ${stepIndex + 1} / ${activeData.items.length}</div>`;
                html += `</div></div>`;
            }
            container.innerHTML = html;
        }

        function toggleMultiMCQ(optIdx) {
            const item = activeData.items[stepIndex];
            const opt = activeData.currentOptions[optIdx];
            const idx = activeData.multiSelected.indexOf(opt);
            if (idx > -1) activeData.multiSelected.splice(idx, 1);

            renderActivityView();
        }

        function semakPerenggan() {
            const correctAnswers = activeData.pool; 
            let isAllCorrect = true;
            
            activeData.targets.forEach((t, i) => {
                const placedItem = activeData.poolState.find(p => p.id === t.placedId);
                if (!placedItem || placedItem.text !== activeData.pool[i]) isAllCorrect = false;
            });

            if (isAllCorrect) {
                showFeedback(true, '', '', () => { paparTamatAktiviti(); });
            } else {
                showFeedback(false, "Sila pastikan semua jawapan diletakkan di tempat yang betul berdasarkan turutan yang logik.", "Terdapat kesalahan pada susunan jawapan anda.", () => { renderActivityView(); });
            }
        }

        function renderKategoriInline(container) {
            let html = `<div class="flex flex-wrap justify-center items-stretch gap-6 w-full mb-8 max-w-6xl mx-auto">`;
            activeData.categories.forEach(cat => {
                const itemsInCat = activeData.pool.filter(p => p.catId === cat.id);
                html += `<div class="flex-1 min-w-[280px] max-w-md w-full bg-white border-4 border-purple-200 rounded-3xl p-6 shadow-xl min-h-[250px] flex flex-col hover:border-purple-300 transition-colors">
                            <h3 class="text-2xl font-chewy text-purple-600 text-center border-b-4 border-dashed border-purple-100 pb-3 mb-4">${cat.name}</h3>
                            <div onclick="tapPlaceKategori('${cat.id}')" class="flex-grow flex flex-col gap-3 rounded-2xl p-4 transition-colors ${selectedIndex !== null && !activeData.isChecked ? 'bg-purple-50 border-4 border-dashed border-purple-400 cursor-pointer animate-pulse' : 'bg-gray-50 border-4 border-dashed border-transparent'}">`;
                            
                itemsInCat.forEach(item => {
                    let styleClass = 'bg-blue-100 text-blue-800 border-blue-300';
                    let icon = '';
                    if (activeData.isChecked) {
                        const isCorrect = item.ans === cat.id;
                        styleClass = isCorrect ? 'bg-green-100 text-green-800 border-green-500 shadow-md' : 'bg-red-50 text-red-500 border-red-300 line-through opacity-80';
                        icon = isCorrect ? '<i class="fas fa-check-circle text-green-600 mr-2"></i>' : '<i class="fas fa-times-circle text-red-500 mr-2"></i>';
                    }
                    html += `<div onclick="kembalikanItemKategori(${item.id}); event.stopPropagation();" class="p-3 border-4 rounded-xl font-bold text-center cursor-pointer text-lg ${styleClass} hover:border-red-500 transition-colors">${icon}${item.text}</div>`;
                });
                
                html += `</div></div>`;
            });
            html += `</div>`;
            
            if (!activeData.isChecked && activeData.pool.every(p => p.catId !== null)) {
                html += `<button onclick="semakKategori()" class="btn-3d w-full max-w-sm mx-auto mb-8 bg-yellow-400 text-yellow-900 font-chewy text-3xl py-4 rounded-3xl border-b-[6px] border-yellow-600 shadow-xl block animate-bounce hover:bg-yellow-300">Semak Jawapan</button>`;
            } else if (activeData.isChecked) {
                html += `<button onclick="paparTamatAktiviti()" class="btn-3d w-full max-w-sm mx-auto mb-8 bg-blue-500 text-white font-chewy text-3xl py-4 rounded-3xl border-b-[6px] border-blue-700 shadow-xl block bounce-in hover:bg-blue-400">Selesai Berbincang!</button>`;
            }

            if (!activeData.isChecked) {
                html += `<div class="flex flex-wrap gap-3 justify-center w-full max-w-4xl mx-auto bg-blue-50 p-6 rounded-3xl border-4 border-blue-200 shadow-inner">`;
                activeData.pool.forEach(p => {
                    if (p.catId !== null) return;
                    const btnClass = selectedIndex === p.id ? 'bg-rose-500 text-white border-rose-600 scale-110 shadow-xl' : 'bg-white text-blue-800 border-blue-300 hover:bg-blue-100';
                    html += `<button onclick="tapSelect(${p.id})" class="btn-3d border-b-4 font-bold p-3 md:p-4 rounded-xl text-lg md:text-xl transition-all ${btnClass}">${p.text}</button>`;
                });
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        function tapPlaceKategori(catId) {
            if (selectedIndex === null || activeData.isChecked) return;
            activeData.pool.find(p => p.id === selectedIndex).catId = catId;
            selectedIndex = null;
            renderActivityView();
        }

        function kembalikanItemKategori(itemId) {
            if (activeData.isChecked) return;
            activeData.pool.find(p => p.id === itemId).catId = null;
            renderActivityView();
        }

        function semakKategori() { activeData.isChecked = true; renderActivityView(); }

        function renderPadan3Kolum(container) {
            let html = `<div class="grid grid-cols-3 gap-2 md:gap-6 mb-8 w-full max-w-5xl items-stretch">
                            <div class="font-bold text-center text-rose-500 mb-2 text-xl md:text-2xl font-chewy">NAMA</div>
                            <div class="font-bold text-center text-blue-500 mb-2 text-xl md:text-2xl font-chewy">GAMBAR</div>
                            <div class="font-bold text-center text-teal-500 mb-2 text-xl md:text-2xl font-chewy">PENJODOH BILANGAN</div>`;

            activeData.items.forEach((item, i) => {
                const pNama = activeData.targetsNama[i].placedId !== undefined ? activeData.poolState.find(p => p.id === activeData.targetsNama[i].placedId) : null;
                const hNama = selectedIndex !== null ? 'border-rose-400 bg-rose-50 cursor-pointer animate-pulse' : 'border-gray-300 bg-gray-50';
                html += `<div class="flex items-center justify-center h-full w-full">`;
                if (pNama) html += `<div onclick="kembalikan3Kolum('nama', ${i})" class="w-full p-2 md:p-4 bg-green-100 text-green-800 border-4 border-green-500 font-bold rounded-xl text-center shadow-md text-sm md:text-xl cursor-pointer hover:bg-red-100 hover:border-red-500 hover:text-red-800 transition-colors">${pNama.text}</div>`;
                else html += `<div onclick="tapPlace3Kolum('nama', ${i})" class="w-full h-16 md:h-20 border-4 border-dashed rounded-xl transition-all ${hNama}"></div>`;
                html += `</div><div class="flex items-center justify-center bg-white rounded-2xl shadow-sm border-2 border-gray-100 p-2"><img src="${item.image}" class="h-16 md:h-24 object-contain"></div>`;

                const pPenj = activeData.targetsPenjodoh[i].placedId !== undefined ? activeData.poolState.find(p => p.id === activeData.targetsPenjodoh[i].placedId) : null;
                const hPenj = selectedIndex !== null ? 'border-teal-400 bg-teal-50 cursor-pointer animate-pulse' : 'border-gray-300 bg-gray-50';
                html += `<div class="flex items-center justify-center h-full w-full">`;
                if (pPenj) html += `<div onclick="kembalikan3Kolum('penjodoh', ${i})" class="w-full p-2 md:p-4 bg-green-100 text-green-800 border-4 border-green-500 font-bold rounded-xl text-center shadow-md text-sm md:text-xl cursor-pointer hover:bg-red-100 hover:border-red-500 hover:text-red-800 transition-colors">${pPenj.text}</div>`;
                else html += `<div onclick="tapPlace3Kolum('penjodoh', ${i})" class="w-full h-16 md:h-20 border-4 border-dashed rounded-xl transition-all ${hPenj}"></div>`;
                html += `</div>`;
            });
            
            html += `</div><div class="bg-blue-50 p-6 rounded-3xl border-4 border-blue-200 shadow-inner w-full max-w-4xl"><h3 class="text-center font-bold text-blue-500 mb-4 text-xl tracking-wider"><i class="fas fa-hand-pointer mr-2"></i>PILIHAN JAWAPAN</h3><div class="flex flex-wrap gap-3 justify-center">`;
            activeData.poolState.forEach((p, i) => {
                if (p.used) return;
                const btnClass = selectedIndex === i ? 'bg-rose-500 text-white border-rose-600 scale-110 shadow-xl' : 'bg-white text-blue-800 border-blue-300 hover:bg-blue-100';
                html += `<button onclick="tapSelect(${i})" class="btn-3d border-b-4 font-bold p-3 md:p-4 rounded-xl text-lg md:text-xl transition-all ${btnClass}">${p.text}</button>`;
            });
            html += `</div></div>`;

            const allPlaced = activeData.targetsNama.every(t => t.placedId !== undefined) && activeData.targetsPenjodoh.every(t => t.placedId !== undefined);
            html += `<button onclick="semak3Kolum()" class="btn-3d w-full max-w-sm mt-6 mx-auto block bg-yellow-400 text-yellow-900 font-chewy text-2xl py-3 rounded-2xl border-b-[6px] border-yellow-600 shadow-lg transition-all ${allPlaced ? 'animate-bounce shadow-yellow-400/50 hover:bg-yellow-300' : 'opacity-50 cursor-not-allowed grayscale'}" ${allPlaced ? '' : 'disabled'}>Semak Padanan</button>`;

            container.innerHTML = html;
        }

        function tapPlace3Kolum(type, index) {
            if (selectedIndex === null) return;
            const poolItem = activeData.poolState[selectedIndex];
            const target = type === 'nama' ? activeData.targetsNama[index] : activeData.targetsPenjodoh[index];

            if (target.placedId !== undefined) {
                activeData.poolState.find(p => p.id === target.placedId).used = false;
            }
            target.placedId = poolItem.id; 
            poolItem.used = true; 
            selectedIndex = null;
            renderActivityView();
        }

        function kembalikan3Kolum(type, index) {
            const target = type === 'nama' ? activeData.targetsNama[index] : activeData.targetsPenjodoh[index];
            if (target.placedId !== undefined) {
                activeData.poolState.find(p => p.id === target.placedId).used = false;
                target.placedId = undefined;
                renderActivityView();
            }
        }

        function semak3Kolum() {
            let isAllCorrect = true;
            activeData.items.forEach((item, i) => {
                const pNama = activeData.poolState.find(p => p.id === activeData.targetsNama[i].placedId);
                const pPenj = activeData.poolState.find(p => p.id === activeData.targetsPenjodoh[i].placedId);
                if (!pNama || pNama.text !== activeData.targetsNama[i].ans) isAllCorrect = false;
                if (!pPenj || pPenj.text !== activeData.targetsPenjodoh[i].ans) isAllCorrect = false;
            });

            if (isAllCorrect) {
                showFeedback(true, '', '', () => { paparTamatAktiviti(); });
            } else {
                showFeedback(false, "Sila periksa dan betulkan semula (Klik jawapan untuk menariknya semula).", "Terdapat kesalahan pada padanan jawapan anda.", () => { renderActivityView(); });
            }
        }

        function renderSalinMenaip(container) {
            let html = `<div class="flex flex-col lg:flex-row gap-6 w-full max-w-6xl mx-auto items-stretch">`;
            
            html += `<div class="w-full lg:w-1/2 flex justify-center bg-blue-50 p-4 rounded-3xl shadow-inner border-4 border-blue-200">
                        <img src="${activeData.image}" class="w-full object-contain rounded-2xl shadow-md border-4 border-white bg-white">
                     </div>`;
                     
            html += `<div class="w-full lg:w-1/2 flex flex-col gap-4">
                        <div class="bg-yellow-50 p-4 md:p-6 rounded-3xl shadow-md border-4 border-yellow-200 flex-grow flex flex-col">
                            <h3 class="text-xl md:text-2xl font-chewy text-yellow-800 mb-4 text-center border-b-4 border-dashed border-yellow-200 pb-2">Taip Semula Petikan Di Sini</h3>
                            <textarea id="taip-ruang" class="w-full flex-grow min-h-[250px] p-4 rounded-xl border-4 border-yellow-300 focus:outline-none focus:border-yellow-500 focus:ring-4 ring-yellow-200 text-lg md:text-xl text-gray-800 resize-none font-bold shadow-inner" style="background-image: repeating-linear-gradient(transparent, transparent 31px, #fcd34d 31px, #fcd34d 32px); line-height: 32px; background-attachment: local;" placeholder="Mula menaip di sini..."></textarea>
                        </div>
                        <button onclick="semakSalinMenaip()" class="btn-3d w-full bg-green-500 text-white font-chewy text-2xl py-4 rounded-2xl border-b-[6px] border-green-700 shadow-xl hover:bg-green-400 transition-all bounce-in">
                            Semak Jawapan!
                        </button>
                     </div>`;
                     
            html += `</div>`;
            container.innerHTML = html;
        }

        function semakSalinMenaip() {
            const text = document.getElementById('taip-ruang').value.trim();
            const wordCount = text.split(/\s+/).filter(w => w.length > 0).length;
            
            if (wordCount >= (activeData.minWords || 30)) {
                showFeedback(true, '', '', () => { paparTamatAktiviti(); });
            } else {
                showFeedback(false, "Sila taip petikan dengan lebih panjang berdasarkan gambar.", "Petikan anda terlalu pendek atau belum lengkap.", () => {});
            }
        }

        function renderBacaan(container) {
            container.innerHTML = `<div class="w-full flex flex-col items-center gap-8"><img src="${activeData.image}" class="max-w-full md:max-w-3xl rounded-3xl shadow-2xl border-4 border-white"><button onclick="paparTamatAktiviti()" class="btn-3d bg-green-500 hover:bg-green-400 text-white font-chewy text-3xl py-4 px-12 rounded-3xl border-b-[6px] border-green-700 shadow-xl bounce-in">Selesai Membaca!</button></div>`;
        }

        function renderWordSearch(container) {
            if (!activeData.selectedCells) {
                activeData.foundWords = [];
                activeData.selectedCells = [];
            }

            let html = `<div class="w-full flex flex-col md:flex-row gap-8 items-center md:items-start justify-center max-w-5xl mx-auto">`;
            
            html += `<div class="bg-white p-4 md:p-6 rounded-3xl shadow-xl border-4 border-indigo-200">
                        <div class="grid grid-cols-8 gap-1 md:gap-2">`;
                        
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const isSelected = activeData.selectedCells.some(cell => cell.r === r && cell.c === c);
                    const isFound = activeData.foundWords.some(wObj => wObj.cells.some(cell => cell.r === r && cell.c === c));
                    
                    let btnClass = 'bg-gray-50 text-gray-700 border-gray-200 hover:bg-indigo-50';
                    if (isFound) btnClass = 'bg-green-400 text-white border-green-600 shadow-inner scale-95';
                    else if (isSelected) btnClass = 'bg-yellow-400 text-yellow-900 border-yellow-600 scale-105 shadow-md';
                    
                    html += `<button onclick="tapWordSearch(${r}, ${c})" class="w-10 h-10 md:w-14 md:h-14 rounded-xl border-b-4 font-bold text-xl md:text-2xl transition-all flex items-center justify-center ${btnClass} ${isFound ? 'pointer-events-none' : ''}">${activeData.grid[r][c]}</button>`;
                }
            }
            html += `</div>
                     <button onclick="clearWordSearch()" class="mt-6 w-full btn-3d bg-rose-500 text-white font-bold font-chewy text-xl py-3 rounded-xl border-b-4 border-rose-700 shadow-md">Padam Pilihan Semasa</button>
                     </div>`;
                     
            html += `<div class="w-full md:w-1/3 bg-indigo-50 p-6 rounded-3xl border-4 border-indigo-200 shadow-inner">
                        <h3 class="text-2xl font-chewy text-indigo-700 mb-6 text-center border-b-4 border-dashed border-indigo-200 pb-2">CARI PERKATAAN</h3>
                        <div class="flex flex-col gap-3">`;
                        
            activeData.words.forEach(w => {
                const isFound = activeData.foundWords.some(fw => fw.word === w);
                const styleClass = isFound ? 'bg-green-100 text-green-600 border-green-400 line-through opacity-70' : 'bg-white text-indigo-900 border-indigo-300 shadow-sm';
                const icon = isFound ? '<i class="fas fa-check-circle mr-3"></i>' : '<i class="fas fa-search mr-3 opacity-50"></i>';
                html += `<div class="font-bold text-xl p-3 md:p-4 border-4 rounded-xl flex items-center ${styleClass}">${icon}${w}</div>`;
            });
            
            html += `</div></div></div>`;
            container.innerHTML = html;
        }

        function tapWordSearch(r, c) {
            const existingIdx = activeData.selectedCells.findIndex(cell => cell.r === r && cell.c === c);
            if (existingIdx > -1) {
                activeData.selectedCells.splice(existingIdx, 1);
            } else {
                activeData.selectedCells.push({r, c, char: activeData.grid[r][c]});
            }
            
            const selectedWord = activeData.selectedCells.map(c => c.char).join('');
            const reversedWord = activeData.selectedCells.map(c => c.char).reverse().join('');
            
            let matchedWord = activeData.words.find(w => w === selectedWord || w === reversedWord);
            
            if (matchedWord && !activeData.foundWords.some(fw => fw.word === matchedWord)) {
                activeData.foundWords.push({ word: matchedWord, cells: [...activeData.selectedCells] });
                activeData.selectedCells = [];
                if (activeData.foundWords.length === activeData.words.length) setTimeout(paparTamatAktiviti, 600);
            }
            renderActivityView();
        }

        function clearWordSearch() {
            activeData.selectedCells = [];
            renderActivityView();
        }

        function renderHotspotKlik(container) {
            const qData = activeData.items[stepIndex];
            if (!activeData.selectedHotspots || activeData.currentQ !== stepIndex) {
                activeData.selectedHotspots = [];
                activeData.currentQ = stepIndex;
            }

            let html = `<div class="flex flex-col md:flex-row gap-8 items-start w-full max-w-6xl mx-auto">`;
            
            html += `<div class="w-full md:w-2/3 relative rounded-3xl shadow-2xl border-4 border-white overflow-hidden bg-white">
                        <img src="${activeData.image}" class="w-full h-auto block select-none pointer-events-none">`;
            
            activeData.hotspots.forEach((hs, hsIdx) => {
                const isSelected = activeData.selectedHotspots.includes(hs.id);
                const styleClass = isSelected ? 'bg-green-400/50 border-4 border-green-600 scale-105 z-10' : 'bg-white/10 hover:bg-white/30 border-2 border-dashed border-gray-800/50';
                html += `<div onclick="tapHotspot(${hsIdx})" class="absolute rounded-xl transition-all cursor-pointer flex items-center justify-center group ${styleClass}" style="top: ${hs.top}%; left: ${hs.left}%; width: ${hs.w}%; height: ${hs.h}%;">
                            <div class="absolute -top-12 bg-black text-white font-bold py-1 px-3 rounded-lg text-sm md:text-base opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none shadow-lg z-20">${hs.text}</div>
                            ${isSelected ? '<i class="fas fa-check-circle text-3xl text-green-700 drop-shadow-md bg-white rounded-full"></i>' : ''}
                         </div>`;
            });
            html += `</div>`;
            
            html += `<div class="w-full md:w-1/3 flex flex-col gap-6">
                        <div class="bg-blue-50 p-6 rounded-3xl shadow-md border-4 border-blue-200">
                            <h3 class="text-2xl md:text-3xl font-bold text-blue-900 mb-4 leading-snug">${qData.q}</h3>
                            <div class="flex items-center gap-2 text-lg font-bold text-gray-600 mb-6 bg-white p-3 rounded-xl border-2 border-blue-100">
                                <span>Pilihan Semasa: </span>
                                <span class="${activeData.selectedHotspots.length === qData.reqCount ? 'text-green-600 font-black' : 'text-rose-500'} text-2xl">${activeData.selectedHotspots.length} / ${qData.reqCount}</span>
                            </div>
                            <button onclick="semakHotspot()" class="btn-3d w-full bg-yellow-400 text-yellow-900 font-chewy text-2xl py-4 rounded-2xl border-b-[6px] border-yellow-600 shadow-lg transition-all ${activeData.selectedHotspots.length === qData.reqCount ? 'animate-bounce shadow-yellow-400/50 hover:bg-yellow-300' : 'opacity-50 cursor-not-allowed grayscale'}" ${activeData.selectedHotspots.length === qData.reqCount ? '' : 'disabled'}>Semak Jawapan!</button>
                        </div>
                        <div class="text-center text-gray-500 font-bold bg-gray-100 rounded-full py-2 px-6 inline-block text-lg border-2 border-gray-200 shadow-sm mx-auto">Soalan ${stepIndex + 1} / ${activeData.items.length}</div>
                     </div>`;
                     
            html += `</div>`;
            container.innerHTML = html;
        }

        function tapHotspot(hsIdx) {
            const hsId = activeData.hotspots[hsIdx].id;
            const qData = activeData.items[stepIndex];
            const idx = activeData.selectedHotspots.indexOf(hsId);
            if (idx > -1) activeData.selectedHotspots.splice(idx, 1);
            else if (activeData.selectedHotspots.length < qData.reqCount) activeData.selectedHotspots.push(hsId);
            renderActivityView();
        }

        function semakHotspot() {
            const qData = activeData.items[stepIndex];
            const selectedObj = activeData.selectedHotspots.map(id => activeData.hotspots.find(h => h.id === id));
            
            let isAllCorrect = (qData.targetType === 'any') ? true : selectedObj.every(hs => hs.type === qData.targetType);
            
            if (isAllCorrect) {
                showFeedback(true, '', '', () => { 
                    stepIndex++; 
                    if (stepIndex >= activeData.items.length) { stepIndex--; paparTamatAktiviti(); }
                    else { renderActivityView(); }
                });
            } else {
                const wrongOnes = selectedObj.filter(hs => hs.type !== qData.targetType).map(hs => hs.text).join(", ");
                const expectedText = qData.targetType === 'any' ? 'Mana-mana makanan berkhasiat' : `Makanan jenis ${qData.targetType.toUpperCase()}`;
                showFeedback(false, expectedText, wrongOnes, () => { activeData.selectedHotspots = []; renderActivityView(); });
            }
        }

        function showFeedback(isCorrect, rightAns, wrongAns, callback) {
            const modal = document.getElementById('modal-feedback');
            const icon = document.getElementById('feedback-icon');
            const title = document.getElementById('feedback-title');
            const msg = document.getElementById('feedback-message');
            
            if (isCorrect) {
                icon.innerHTML = '<span class="text-green-500 drop-shadow-md">🌟</span>';
                title.innerText = 'Syabas!';
                title.className = 'text-5xl font-chewy text-green-500 mb-4 drop-shadow-sm';
                msg.innerHTML = 'Hebat! Jawapan anda tepat sekali.';
            } else {
                icon.innerHTML = '<span class="text-rose-500 drop-shadow-md">💡</span>';
                title.innerText = 'Cuba Lagi!';
                title.className = 'text-5xl font-chewy text-rose-500 mb-4 drop-shadow-sm';
                msg.innerHTML = `Terdapat kesalahan pada jawapan anda.<br><br><span class="text-base text-gray-400">Petunjuk/Jawapan Sebenar:</span><br><span class="text-blue-600 text-xl font-bold bg-blue-50 p-2 md:p-3 rounded-lg inline-block mt-2 border-2 border-blue-100">${rightAns}</span>`;
            }
            
            document.getElementById('btn-next').innerText = 'Seterusnya';
            document.getElementById('btn-next').onclick = () => { modal.classList.add('hidden'); if (callback) callback(); };
            modal.classList.remove('hidden');
        }

        function paparTamatAktiviti() {
            const modal = document.getElementById('modal-feedback');
            document.getElementById('feedback-icon').innerHTML = '<span class="drop-shadow-lg">🏆</span>';
            const title = document.getElementById('feedback-title');
            title.innerText = 'Tahniah!';
            title.className = 'text-5xl font-chewy text-yellow-500 mb-4 drop-shadow-sm';
            document.getElementById('feedback-message').innerHTML = `Anda telah berjaya melengkapkan aktiviti ini dengan cemerlang!`;
            
            document.getElementById('btn-next').innerText = 'Tutup & Bincang';
            document.getElementById('btn-next').onclick = () => { modal.classList.add('hidden'); };
            modal.classList.remove('hidden');
        }

        // Start App
        window.onload = initApp;

    </script>
</body>
</html>
