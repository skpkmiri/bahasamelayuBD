            to { opacity: 1; transform: translateY(0); }

        let navHistory = ['view-home'];
        let activeData = null; 
        let stepIndex = 0; 
        let selectedIndex = null; 

        function navigateTo(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
            
            navHistory.push(viewId);
            updateNavButtons();
            
            const banner = document.getElementById('main-banner');
            if (viewId === 'view-home') banner.classList.remove('hidden');
            else banner.classList.add('hidden');
        }

        function goBack() {
            if (navHistory.length > 1) {
                navHistory.pop(); 
                const prev = navHistory[navHistory.length - 1];
                
                document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
                document.getElementById(prev).classList.remove('hidden');
                
                updateNavButtons();
                const banner = document.getElementById('main-banner');
                if (prev === 'view-home') banner.classList.remove('hidden');
                else banner.classList.add('hidden');
            }
        }

        function goHome() {
            navHistory = [];
            navigateTo('view-home');
        }

        function updateNavButtons() {
            const btnBack = document.getElementById('btn-back');
            if (navHistory.length > 1) btnBack.classList.remove('hidden');
            else btnBack.classList.add('hidden');
        }

        function initApp() {
            const grid = document.getElementById('tema-grid');
            grid.innerHTML = '';
            
            dataKurikulum.forEach((tema, idx) => {
                const btn = document.createElement('button');
                const specialClass = (idx === 4) ? 'sm:col-span-2 mx-auto w-full sm:w-[50%]' : 'w-full';
                btn.className = `btn-3d p-4 md:p-6 rounded-3xl text-white font-chewy text-2xl md:text-3xl text-left flex justify-between items-center shadow-lg hover:shadow-xl bg-gradient-to-r ${tema.color} ${specialClass} border-b-[6px] border-black/20`;
                btn.innerHTML = `<span>${tema.tema}</span> <i class="fas fa-chevron-right ml-2 text-white/50 text-xl"></i>`;
                btn.onclick = () => openTema(idx);
                grid.appendChild(btn);
            });
        }

        function openTema(temaIdx) {
            const temaData = dataKurikulum[temaIdx];
            document.getElementById('title-tema').innerText = temaData.tema;
            
            const grid = document.getElementById('unit-grid');
            grid.innerHTML = '';
            
            if (temaData.units && temaData.units.length > 0) {
                temaData.units.forEach((unit, idx) => {
                    const btn = document.createElement('button');
                    btn.className = `btn-3d w-full sm:w-[45%] md:w-[30%] bg-white rounded-3xl p-6 text-center border-4 border-gray-100 shadow-xl group hover:border-purple-300 flex flex-col items-center`;
                    btn.innerHTML = `
                        <div class="w-16 h-16 rounded-full flex items-center justify-center text-3xl font-chewy text-white bg-gradient-to-br ${temaData.color} mb-4 shadow-inner">${idx + 1}</div>
                        <div class="text-xl md:text-2xl font-bold text-gray-700 leading-snug">${unit.title}</div>
                    `;
                    btn.onclick = () => openUnit(temaIdx, idx);
                    grid.appendChild(btn);
                });
            } else {
                grid.innerHTML = `<div class="w-full text-center text-gray-500 font-bold p-10 bg-white rounded-3xl">Kandungan tema ini akan dikemas kini kelak!</div>`;
            }
            navigateTo('view-units');
        }

        function openUnit(temaIdx, unitIdx) {
            const unitData = dataKurikulum[temaIdx].units[unitIdx];
            document.getElementById('title-unit').innerText = unitData.title;
            
            const list = document.getElementById('activity-list');
            const ruangKosong = document.getElementById('ruang-kosong');
            list.innerHTML = '';
            
            if (unitData.activities && unitData.activities.length > 0) {
                ruangKosong.classList.add('hidden');
                list.classList.remove('hidden');
                
                unitData.activities.forEach((act, actIdx) => {
                    const btn = document.createElement('button');
                    btn.className = `btn-3d w-full bg-white p-5 rounded-2xl border-4 border-teal-100 flex items-center gap-4 hover:bg-teal-50 text-left shadow-md mb-3`;
                    btn.innerHTML = `
                        <div class="bg-teal-500 text-white w-14 h-14 rounded-xl flex items-center justify-center text-2xl shadow-inner"><i class="fas fa-play"></i></div>
                        <div class="font-bold text-xl md:text-2xl text-teal-800">${act.name}</div>
                    `;
                    btn.onclick = () => openActivity(temaIdx, unitIdx, actIdx);
                    list.appendChild(btn);
                });
            } else {
                list.classList.add('hidden');
                ruangKosong.classList.remove('hidden');
            }
            navigateTo('view-activities');
        }

        function openActivity(temaIdx, unitIdx, actIdx) {
            activeData = JSON.parse(JSON.stringify(dataKurikulum[temaIdx].units[unitIdx].activities[actIdx]));
            document.getElementById('play-title').innerText = activeData.name;
            
            stepIndex = 0;
            selectedIndex = null;
            
            if (activeData.type === 'padan' || activeData.type === 'padan-overlay' || activeData.type === 'isi-kosong-perenggan') {
                activeData.poolState = [...activeData.pool].sort(() => 0.5 - Math.random()).map((t, i) => ({ text: t, used: false, id: i }));
            } else if (activeData.type === 'kategori-inline') {
                activeData.pool.forEach((p, i) => { p.id = i; p.catId = null; });
            } else if (activeData.type === 'padan-3-kolum') {
                activeData.poolState = activeData.pool.map((t, i) => ({ text: t, used: false, id: i }));
                activeData.targetsNama = activeData.items.map(it => ({ ans: it.nama, placedId: undefined }));
                activeData.targetsPenjodoh = activeData.items.map(it => ({ ans: it.penjodoh, placedId: undefined }));
            }

            if (activeData.type === 'isi-kosong' && activeData.items) {
                activeData.items = activeData.items.sort(() => 0.5 - Math.random());
            }

            renderActivityView();
            navigateTo('view-play');
        }

        function getInstruction(type) {
            switch(type) {
                case 'mcq': return "Pilih satu jawapan yang paling tepat.";
                case 'mcq-berkaitan': return "Pilih jawapan yang betul berdasarkan maklumat yang diberikan.";
                case 'padan': return "Klik pilihan jawapan di bawah, kemudian klik pada petak kosong yang sepadan. Klik semula jawapan untuk menukarnya jika tersalah jawab.";
                case 'padan-overlay': return "Klik pilihan jawapan, kemudian letakkan ke dalam petak kosong pada gambar. Klik semula jawapan untuk menukarnya.";
                case 'padan-3-kolum': return "Klik pilihan jawapan, kemudian susun ke dalam lajur yang betul. Klik semula untuk menukar jawapan jika tersilap.";
                case 'susun-ayat': return "Klik dan susun perkataan di bawah mengikut urutan. Klik semula untuk menukar jawapan jika tersilap.";
                case 'kategori-inline': return "Klik pilihan jawapan dan masukkan ke dalam kumpulan kategori yang betul. Klik semula pada kategori untuk menukar.";
                case 'bacaan': return "Sila baca petikan di bawah dengan teliti sebelum meneruskan pembelajaran.";
                case 'isi-kosong': return "Klik pilihan jawapan, kemudian klik pada tempat kosong pada ayat. Klik semula jawapan untuk membatalkan pilihan.";
                case 'isi-kosong-perenggan': return "Klik atau seret (drag) pilihan jawapan ke dalam tempat kosong. Klik semula jawapan sekiranya ingin membetulkan kesilapan.";
                case 'hotspot-klik': return "Klik pada bahagian gambar yang betul berdasarkan soalan yang diberikan.";
                case 'word-search': return "Klik pada huruf-huruf bersebelahan di dalam grid untuk mencari perkataan tersembunyi.";
                case 'salin-menaip': return "Taip semula petikan di atas ke dalam ruangan yang disediakan dengan ejaan yang betul.";
                default: return "Selesaikan tugasan interaktif di bawah.";
            }
        }

        function renderActivityView() {
            const container = document.getElementById('play-container');
            container.innerHTML = '';
            
            const arahanHTML = `
                <div class="w-full text-center mb-6 fade-in">
                    <div class="inline-block bg-yellow-100 text-yellow-900 font-bold text-sm md:text-lg px-6 py-2 rounded-full border-4 border-yellow-300 shadow-md">
                        <i class="fas fa-lightbulb mr-2 animate-pulse text-yellow-600"></i>
                        <span class="font-chewy tracking-wide text-yellow-700">ARAHAN:</span> ${getInstruction(activeData.type)}
                    </div>
                </div>`;
            container.innerHTML = arahanHTML;

            const contentContainer = document.createElement('div');
            contentContainer.className = "w-full flex-grow flex flex-col justify-center items-center";
            container.appendChild(contentContainer);
            
            if (activeData.type === 'mcq') renderMCQ(contentContainer);
            else if (activeData.type === 'padan') renderPadan(contentContainer);
            else if (activeData.type === 'padan-overlay') renderPadanOverlay(contentContainer);
            else if (activeData.type === 'kategori-inline') renderKategoriInline(contentContainer);
            else if (activeData.type === 'susun-ayat') renderSusunAyat(contentContainer);
            else if (activeData.type === 'padan-3-kolum') renderPadan3Kolum(contentContainer);
            else if (activeData.type === 'bacaan') renderBacaan(contentContainer);
            else if (activeData.type === 'isi-kosong') renderIsiKosong(contentContainer);
            else if (activeData.type === 'mcq-berkaitan') renderMCQBerkaitan(contentContainer);
            else if (activeData.type === 'hotspot-klik') renderHotspotKlik(contentContainer);
            else if (activeData.type === 'isi-kosong-perenggan') renderIsiKosongPerenggan(contentContainer);
            else if (activeData.type === 'word-search') renderWordSearch(contentContainer);
            else if (activeData.type === 'salin-menaip') renderSalinMenaip(contentContainer);
        }

        function tapSelect(poolIndex) {
            selectedIndex = (selectedIndex === poolIndex) ? null : poolIndex; 
            renderActivityView();
        }
        function checkMCQ(optIdx) {
            const selectedSafe = activeData.currentOptions[optIdx];
            const correct = activeData.currentAns;
            if (selectedSafe === correct) {
                showFeedback(true, correct, selectedSafe, () => { 
                    stepIndex++; 
                    if (stepIndex >= activeData.items.length) { stepIndex--; paparTamatAktiviti(); }
                    else renderActivityView(); 
                });
            } else {
                showFeedback(false, correct, selectedSafe, () => renderActivityView());
            }
        }

        function renderPadan(container) {
            let html = ``;
            if (activeData.overallImage) {
                html += `<div class="w-full flex justify-center mb-6"><img src="${activeData.overallImage}" class="max-h-[40vh] object-contain rounded-2xl shadow-md border-4 border-white bg-white/50 p-2"></div>`;
            } else if (activeData.overallImages) {
                html += `<div class="flex flex-wrap justify-center gap-4 mb-8 w-full bg-white/40 p-4 rounded-3xl border-4 border-dashed border-gray-300">`;
                activeData.overallImages.forEach(img => {
                    html += `<img src="${img}" class="h-28 md:h-40 object-contain rounded-2xl shadow-xl border-4 border-white transform transition hover:scale-105">`;
                });
                html += `</div>`;
            }

            const colClass = activeData.cols === 4 ? 'grid-cols-2 lg:grid-cols-4' : (activeData.cols === 2 ? 'md:grid-cols-2' : (activeData.cols === 1 ? 'grid-cols-1' : 'md:grid-cols-3'));
            html += `<div class="grid grid-cols-2 ${colClass} gap-4 md:gap-6 mb-8 w-full">`;
            
            activeData.targets.forEach((t, i) => {
                const placedItem = t.placedId !== undefined ? activeData.poolState.find(p => p.id === t.placedId) : null;
                const isTargeted = selectedIndex !== null;
                const hoverClass = isTargeted ? 'border-rose-400 bg-rose-50 cursor-pointer animate-pulse shadow-rose-200' : 'border-gray-300 bg-gray-50';
                
                let contentHtml = '';
                if (t.image) contentHtml = `<img src="${t.image}" class="h-24 md:h-32 object-contain mx-auto mb-4 rounded-xl border-2 border-gray-100">`;
                else if (t.text) contentHtml = `<div class="text-base md:text-xl font-bold text-center mb-4 text-gray-700 leading-snug">${t.text}</div>`;
                
                html += `<div class="bg-white p-4 rounded-2xl shadow-lg border-4 border-gray-100 flex flex-col justify-between h-full hover:border-blue-200 transition-colors">
                            ${contentHtml}`;
                            
                if (placedItem) {
                    let isImage = /\.(jpeg|jpg|gif|png)/i.test(String(placedItem.text).trim());
                    let placedContent = isImage
                        ? `<img src="${String(placedItem.text).trim()}" class="h-14 md:h-20 object-contain mx-auto rounded-md drop-shadow-sm">`
                        : `<i class="fas fa-check-circle mr-2 hidden md:inline"></i>${placedItem.text}`;
                        
                    html += `<div onclick="kembalikanPadan(${i})" class="w-full bg-green-100 text-green-800 border-4 border-green-500 font-bold p-2 md:p-3 rounded-xl text-center text-sm md:text-xl shadow-sm flex items-center justify-center cursor-pointer hover:bg-red-100 hover:border-red-500 hover:text-red-800 transition-colors">${placedContent}</div>`;
                } else {
                    html += `<div onclick="tapPlaceNormal(${i})" class="w-full h-14 md:h-16 border-4 border-dashed rounded-xl flex items-center justify-center font-bold transition-all ${hoverClass}"></div>`;
                }
                html += `</div>`;
            });
            
            html += `</div>`;
            html += `<div class="bg-blue-50 p-6 rounded-3xl border-4 border-blue-200 shadow-inner w-full max-w-5xl"><h3 class="text-center font-bold text-blue-500 mb-4 text-xl tracking-wider"><i class="fas fa-hand-pointer mr-2 animate-bounce"></i>PILIHAN JAWAPAN</h3><div class="flex flex-wrap gap-3 justify-center">`;
            
            activeData.poolState.forEach((p, i) => {
                if (p.used) return;
                const isSelected = selectedIndex === i;
                const btnClass = isSelected ? 'bg-rose-500 text-white border-rose-600 scale-110 shadow-xl' : 'bg-white text-blue-800 border-blue-300 hover:bg-blue-100';
                
                let isImage = /\.(jpeg|jpg|gif|png)/i.test(String(p.text).trim());
                let poolContent = isImage
                    ? `<img src="${String(p.text).trim()}" class="h-12 md:h-16 w-auto object-contain pointer-events-none drop-shadow-md rounded-md">`
                    : p.text;
                html += `<button onclick="tapSelect(${i})" class="btn-3d border-b-4 font-bold p-3 md:p-4 rounded-xl text-lg md:text-xl transition-all flex items-center justify-center min-w-[80px] ${btnClass}">${poolContent}</button>`;
            });
            html += `</div></div>`;

            const allPlaced = activeData.targets.every(t => t.placedId !== undefined);
            html += `<button onclick="semakPadan()" class="btn-3d w-full max-w-sm mt-6 mx-auto block bg-yellow-400 text-yellow-900 font-chewy text-2xl py-3 rounded-2xl border-b-[6px] border-yellow-600 shadow-lg transition-all ${allPlaced ? 'animate-bounce shadow-yellow-400/50 hover:bg-yellow-300' : 'opacity-50 cursor-not-allowed grayscale'}" ${allPlaced ? '' : 'disabled'}>Semak Jawapan</button>`;

            container.innerHTML = html;
        }

        function renderPadanOverlay(container) {
            const fontStyle = activeData.fontClass || "text-xs md:text-base";
            
            let htmlImage = `<div class="relative w-full border-4 border-white shadow-2xl rounded-2xl overflow-hidden bg-white">
                            <img src="${activeData.image}" class="w-full h-auto block select-none pointer-events-none">`;
            
            activeData.targets.forEach((t, i) => {
                const placedItem = t.placedId !== undefined ? activeData.poolState.find(p => p.id === t.placedId) : null;
                const isTargeted = selectedIndex !== null;
                htmlImage += `<div class="absolute flex items-center justify-center" style="top: ${t.top}%; left: ${t.left}%; width: ${t.w}%; height: ${t.h}%;">`;
                
                if (placedItem) {
                    let isImage = /\.(jpeg|jpg|gif|png)/i.test(String(placedItem.text).trim());
                    let innerContent = isImage
                        ? `<img src="${String(placedItem.text).trim()}" class="w-full h-full object-contain p-1">`
                        : placedItem.text;

                    htmlImage += `<div onclick="kembalikanPadan(${i})" class="w-full h-full bg-white text-green-800 border-4 border-green-600 font-bold flex items-center justify-center shadow-lg overflow-hidden text-center leading-tight rounded-xl ${fontStyle} cursor-pointer hover:bg-red-50 hover:text-red-600 hover:border-red-500 transition-colors">
                                ${innerContent}
                             </div>`;
                } else {
                    const hoverClass = isTargeted ? 'border-rose-500 bg-rose-300/60 animate-pulse ring-4 ring-rose-300 cursor-pointer' : 'bg-transparent cursor-pointer hover:bg-black/10';

                }
                htmlImage += `</div>`;
            });
            htmlImage += `</div>`;
            
            let htmlPool = ``;
            let htmlPoolInner = ``;
            activeData.poolState.forEach((p, i) => {
                if (p.used) return;
                const btnClass = selectedIndex === i ? 'bg-rose-500 text-white border-rose-600 scale-110 shadow-xl' : 'bg-white text-blue-800 border-blue-300 hover:bg-blue-100';
                
                let isImage = /\.(jpeg|jpg|gif|png)/i.test(String(p.text).trim());
                let poolContent = isImage
                    ? `<img src="${String(p.text).trim()}" class="h-14 md:h-20 w-auto object-contain pointer-events-none drop-shadow-md">`
                    : p.text;
                htmlPoolInner += `<button onclick="tapSelect(${i})" class="btn-3d border-b-4 font-bold p-2 md:p-3 rounded-xl ${fontStyle} transition-all flex items-center justify-center min-w-[80px] md:min-w-[100px] ${btnClass}">${poolContent}</button>`;

            const allPlaced = activeData.targets.every(t => t.placedId !== undefined);

                container.innerHTML = htmlPool + htmlImage + semakBtn;
            } else {
                htmlPool = `<div class="flex flex-wrap gap-2 md:gap-3 justify-center w-full max-w-4xl mx-auto bg-blue-50 p-4 md:p-5 rounded-3xl border-4 border-blue-200 shadow-inner mb-4 mt-4">${htmlPoolInner}</div>`;
                container.innerHTML = htmlImage + htmlPool + semakBtn;

                activeData.initialized = true;
            }
            let html = `<div class="flex flex-col md:flex-row gap-6 w-full max-w-6xl mx-auto items-start">`;
            html += `<div class="w-full md:w-1/2"><img src="${activeData.overallImage}" class="w-full h-auto object-contain rounded-2xl shadow-xl border-4 border-white sticky top-4"></div>`;
            html += `<div class="w-full md:w-1/2 flex flex-col gap-8">`;
            activeData.items.forEach((item, qIdx) => {
                html += `<div class="bg-blue-50 p-6 rounded-3xl border-4 border-blue-100 shadow-inner"><h3 class="text-xl font-bold text-gray-800 mb-4">${item.q}</h3><div class="flex flex-col gap-3">`;
                item.options.forEach((opt) => {
                    const isSelected = item.userAns === opt || (Array.isArray(item.userAns) && item.userAns.includes(opt));
                    const btnClass = isSelected ? 'bg-blue-500 text-white border-blue-600 shadow-md' : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-50';
                    const clickHandler = item.type === 'multi' ? `checkMCQMulti(${qIdx}, '${opt.replace(/'/g, "\\'")}')` : `checkMCQSingle(${qIdx}, '${opt.replace(/'/g, "\\'")}')`;
                    html += `<button onclick="${clickHandler}" class="btn-3d border-2 p-3 rounded-xl text-left transition-all ${btnClass}">${opt}</button>`;
                });
                html += `</div></div>`;
            });
            html += `<button onclick="semakMCQBerkaitan()" class="btn-3d w-full mt-4 bg-yellow-400 text-yellow-900 font-chewy text-2xl py-3 rounded-2xl border-b-[6px] border-yellow-600 shadow-lg hover:bg-yellow-300">Semak Jawapan</button></div></div>`;
            container.innerHTML = html;
        }

        window.checkMCQSingle = function(qIdx, opt) { activeData.items[qIdx].userAns = opt; renderActivityView(); }
        window.checkMCQMulti = function(qIdx, opt) { 
            let ans = activeData.items[qIdx].userAns || [];
            if (ans.includes(opt)) ans = ans.filter(a => a !== opt); else if (ans.length < activeData.items[qIdx].reqCount) ans.push(opt);
            activeData.items[qIdx].userAns = ans; 
            renderActivityView(); 
        }
        window.semakMCQBerkaitan = function() {
            let isCorrect = true;
            activeData.items.forEach(item => {
                if (item.type === 'multi') {
                    if (!item.userAns || item.userAns.length !== item.ans.length || !item.userAns.every(a => item.ans.includes(a))) isCorrect = false;
                } else {
                    if (item.userAns !== item.ans) isCorrect = false;
                }
            });
            if (isCorrect) showFeedback(true, '', '', () => paparTamatAktiviti());
            else showFeedback(false, "Sila semak semula pilihan anda.", "Terdapat jawapan yang kurang tepat.", () => {});
        }

        function renderIsiKosongPerenggan(container) {
            if (!activeData.poolState) {
                activeData.poolState = [...activeData.pool].sort(() => 0.5 - Math.random()).map((t, i) => ({ text: t, used: false, id: i }));
                activeData.targets = Array(activeData.pool.length).fill().map(() => ({ placedId: undefined }));
            }
            let html = `<div class="w-full max-w-5xl mx-auto flex flex-col gap-8">`;
            if (activeData.images) {
                html += `<div class="flex justify-center gap-4 flex-wrap">`;
                activeData.images.forEach(img => { html += `<img src="${img}" class="h-32 object-contain rounded-xl border-4 border-white shadow-md">`; });
                html += `</div>`;
            }
            let textContent = activeData.text;
            activeData.targets.forEach((target, i) => {
                const placedItem = target.placedId !== undefined ? activeData.poolState.find(p => p.id === target.placedId) : null;
                const blankHtml = placedItem 
                    ? `<span onclick="kembalikanPerenggan(${i})" class="inline-block px-3 py-1 mx-1 bg-green-100 text-green-800 border-b-4 border-green-500 font-bold rounded-lg cursor-pointer hover:bg-red-100 hover:border-red-500 hover:text-red-800 transition-colors align-middle shadow-sm">${placedItem.text}</span>` 
                    : `<span onclick="tapPlacePerenggan(${i})" class="inline-block px-8 py-3 mx-1 border-b-4 border-dashed rounded-lg cursor-pointer align-middle transition-all ${selectedIndex !== null ? 'border-rose-400 bg-rose-50 animate-pulse' : 'border-gray-400 bg-gray-100'}"></span>`;
                textContent = textContent.replace(`[${i}]`, blankHtml);
            });
            html += `<div class="bg-white p-6 md:p-8 rounded-3xl shadow-lg border-4 border-blue-100 text-lg md:text-xl text-gray-700 leading-loose ${activeData.textClass || ''}">${textContent}</div>`;
            html += `<div class="flex flex-wrap gap-3 justify-center bg-blue-50 p-6 rounded-3xl border-4 border-blue-200 shadow-inner">`;
            activeData.poolState.forEach((p, i) => {
                if (p.used) return;
                const btnClass = selectedIndex === i ? 'bg-rose-500 text-white border-rose-600 scale-110 shadow-xl' : 'bg-white text-blue-700 border-blue-300 hover:bg-blue-100';
                html += `<button onclick="tapSelect(${i})" class="btn-3d border-b-4 font-bold p-2 md:p-3 rounded-xl text-base md:text-lg transition-all ${btnClass}">${p.text}</button>`;
            });
            html += `</div>`;
            const allPlaced = activeData.targets.every(t => t.placedId !== undefined);
            html += `<button onclick="semakPerenggan()" class="btn-3d w-full max-w-sm mt-4 mx-auto block bg-yellow-400 text-yellow-900 font-chewy text-2xl py-3 rounded-2xl border-b-[6px] border-yellow-600 shadow-lg transition-all ${allPlaced ? 'animate-bounce shadow-yellow-400/50 hover:bg-yellow-300' : 'opacity-50 cursor-not-allowed grayscale'}" ${allPlaced ? '' : 'disabled'}>Semak Jawapan</button></div>`;
            container.innerHTML = html;
        }
        
        window.tapPlacePerenggan = function(i) {
            if (selectedIndex === null) return;
            const poolItem = activeData.poolState[selectedIndex];
            if (activeData.targets[i].placedId !== undefined) {
                activeData.poolState.find(p => p.id === activeData.targets[i].placedId).used = false;
            }
            activeData.targets[i].placedId = poolItem.id;
            poolItem.used = true;
            selectedIndex = null;
            renderActivityView();
        }
        window.kembalikanPerenggan = function(i) {
            if (activeData.targets[i].placedId !== undefined) {
                activeData.poolState.find(p => p.id === activeData.targets[i].placedId).used = false;
                activeData.targets[i].placedId = undefined;
                renderActivityView();
            }
        }
        window.semakPerenggan = function() {
            let isCorrect = true;
            activeData.targets.forEach((t, i) => {
                const p = activeData.poolState.find(p => p.id === t.placedId);
                if (!p || p.text !== activeData.pool[i]) isCorrect = false;
            });
            if (isCorrect) showFeedback(true, '', '', () => paparTamatAktiviti());
            else showFeedback(false, "Sila periksa dan betulkan semula (Klik jawapan untuk menariknya semula).", "Terdapat kesalahan pada jawapan anda.", () => renderActivityView());
        }

        function renderHotspotKlik(container) {
            if(!activeData.selectedHotspots) activeData.selectedHotspots = [];
            let html = `<div class="relative w-full max-w-4xl mx-auto border-4 border-white shadow-2xl rounded-2xl overflow-hidden bg-white mb-6">
                            <img src="${activeData.image}" class="w-full h-auto block select-none pointer-events-none">`;
            activeData.hotspots.forEach((h) => {
                const isSelected = activeData.selectedHotspots.includes(h.id);
                const style = `top: ${h.top}%; left: ${h.left}%; width: ${h.w}%; height: ${h.h}%;`;
                const bgClass = isSelected ? 'bg-green-500/50 border-4 border-green-500' : 'hover:bg-blue-300/30 border-2 border-transparent hover:border-blue-300 cursor-pointer';
                html += `<div onclick="toggleHotspot('${h.id}')" class="absolute rounded-xl transition-all ${bgClass}" style="${style}"></div>`;
            });
            html += `</div>`;
            
            const qItem = activeData.items[stepIndex];
            html += `<div class="bg-blue-50 p-6 rounded-3xl border-4 border-blue-200 w-full max-w-4xl mx-auto">
                        <h3 class="text-xl font-bold text-blue-900 mb-4 text-center">${qItem.q}</h3>
                        <div class="text-center font-bold text-gray-600 mb-4">Pilih ${qItem.reqCount} kawasan. (Terpilih: ${activeData.selectedHotspots.length})</div>
                        <button onclick="semakHotspot()" class="btn-3d w-full max-w-sm mx-auto block bg-yellow-400 text-yellow-900 font-chewy text-2xl py-3 rounded-2xl border-b-[6px] border-yellow-600 shadow-lg transition-all ${activeData.selectedHotspots.length === qItem.reqCount ? 'animate-bounce' : 'opacity-50'}" ${activeData.selectedHotspots.length === qItem.reqCount ? '' : 'disabled'}>Semak Jawapan</button>
                     </div>`;
            container.innerHTML = html;
        }
        
        window.toggleHotspot = function(hId) {
            if (activeData.selectedHotspots.includes(hId)) {
                activeData.selectedHotspots = activeData.selectedHotspots.filter(id => id !== hId);
            } else {
                const reqCount = activeData.items[stepIndex].reqCount;
                if (activeData.selectedHotspots.length < reqCount) {
                    activeData.selectedHotspots.push(hId);
                }
            }
            renderActivityView();
        }
        window.semakHotspot = function() {
            const qItem = activeData.items[stepIndex];
            let isCorrect = true;
            if (qItem.targetType !== 'any') {
                activeData.selectedHotspots.forEach(id => {
                    const h = activeData.hotspots.find(x => x.id === id);
                    if (h.type !== qItem.targetType) isCorrect = false;
                });
            }
            if (isCorrect) {
                showFeedback(true, '', '', () => {
                    stepIndex++;
                    activeData.selectedHotspots = [];
                    if (stepIndex >= activeData.items.length) { stepIndex--; paparTamatAktiviti(); }
                    else renderActivityView();
                });
            } else {
                showFeedback(false, "Sila pastikan anda memilih bahagian yang tepat.", "Pilihan anda kurang tepat.", () => { activeData.selectedHotspots = []; renderActivityView(); });
            }
        }

        function renderWordSearch(container) {
            let html = `<div class="flex flex-col items-center gap-6 w-full max-w-3xl mx-auto">
                            <div class="grid grid-rows-${activeData.grid.length} gap-1 bg-white p-4 rounded-2xl shadow-lg border-4 border-blue-100">`;
            activeData.grid.forEach((row) => {
                html += `<div class="flex gap-1">`;
                row.forEach((letter) => {
                    html += `<div class="w-10 h-10 md:w-12 md:h-12 bg-blue-50 font-bold text-xl md:text-2xl text-blue-900 flex items-center justify-center rounded-lg border-2 border-blue-200 cursor-pointer hover:bg-blue-200 transition-colors">${letter}</div>`;
                });
                html += `</div>`;
            });
            html += `</div><button onclick="paparTamatAktiviti()" class="btn-3d w-full max-w-sm mt-4 bg-yellow-400 text-yellow-900 font-chewy text-2xl py-3 rounded-2xl border-b-[6px] border-yellow-600 shadow-lg hover:bg-yellow-300">Selesai Mencari</button></div>`;
            container.innerHTML = html;
        }

        function renderSalinMenaip(container) {
            let html = `<div class="w-full max-w-4xl mx-auto flex flex-col gap-6 items-center">
                            <img src="${activeData.image}" class="max-h-[40vh] object-contain rounded-2xl shadow-xl border-4 border-white">
                            <textarea id="salin-textarea" class="w-full h-48 p-4 rounded-2xl border-4 border-blue-200 shadow-inner text-lg md:text-xl text-gray-800 focus:border-blue-500 focus:outline-none resize-none" placeholder="Taip semula petikan di sini..."></textarea>
                            <button onclick="semakSalinMenaip()" class="btn-3d w-full max-w-sm mt-4 bg-yellow-400 text-yellow-900 font-chewy text-2xl py-3 rounded-2xl border-b-[6px] border-yellow-600 shadow-lg hover:bg-yellow-300">Selesai Menaip</button>
                        </div>`;
            container.innerHTML = html;
        }
        
        window.semakSalinMenaip = function() {
            const text = document.getElementById('salin-textarea').value.trim();
            const wordCount = text.split(/\s+/).filter(w => w.length > 0).length;
            if (wordCount >= (activeData.minWords || 10)) {
                showFeedback(true, '', '', () => paparTamatAktiviti());
            } else {
                showFeedback(false, "Sila taip petikan dengan lengkap mengikut jumlah perkataan minimum.", "Teks terlalu pendek atau kosong.", () => {});
            }
        }

        // Jalankan App
        window.onload = initApp;

    </script>
</body>
</html>
