<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi PDPC BM - SKPK Miri</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fon mesra kanak-kanak: Fredoka untuk tajuk, Nunito untuk teks biasa -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                        display: ['Fredoka', 'sans-serif'],
                    },
                    colors: {
                        // Palet Ceria Kanak-Kanak
                        kid: {
                            blue: '#45B7D1',    // Biru Langit Ceria
                            red: '#FF6B6B',     // Merah Jambu Gelap/Tembikai
                            yellow: '#FDCB6E',  // Kuning Ceria
                            green: '#26DE81',   // Hijau Daun
                            orange: '#FA8231',  // Oren Oren
                            purple: '#A55EEA',  // Ungu Anggur
                            pink: '#FD79A8',    // Merah Jambu Gula-gula
                            bg: '#F0F8FF',      // Biru Awam (Latar belakang)
                            surface: '#FFFFFF',
                            text: '#2D3436'     // Kelabu gelap untuk teks (mudah baca)
                        }
                    },
                    boxShadow: {
                        'chunky': '0 4px 0 0 rgba(0, 0, 0, 0.1)',
                        'chunky-hover': '0 0px 0 0 rgba(0, 0, 0, 0.1)',
                        'floating': '0 10px 25px -5px rgba(69, 183, 209, 0.2)',
                    }
                }
            }
        }
    </script>
    <style>
        /* Gaya palang tatal yang comel dan bulat */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #F0F8FF; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #FDCB6E; 
            border-radius: 10px;
            border: 2px solid #F0F8FF;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #FA8231; 
        }
        
        /* Animasi goyang (wiggle) untuk butang */
        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-3deg); }
            75% { transform: rotate(3deg); }
        }
        .hover-wiggle:hover i {
            animation: wiggle 0.5s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-kid-bg text-kid-text h-screen flex flex-col font-sans overflow-hidden selection:bg-kid-yellow selection:text-kid-text">

    <header class="bg-gradient-to-r from-kid-blue via-kid-purple to-kid-pink text-white shadow-md z-20 border-b-4 border-white/30 rounded-b-3xl mx-2 mt-2 relative overflow-hidden">
        
        <!-- Hiasan latar belakang yang comel (Buih/Bulatan) -->
        <div class="absolute -top-4 -left-4 w-20 h-20 bg-white opacity-20 rounded-full"></div>
        <div class="absolute top-8 right-12 w-12 h-12 bg-kid-yellow opacity-40 rounded-full"></div>
        <div class="absolute -bottom-8 left-1/4 w-24 h-24 bg-white opacity-10 rounded-full"></div>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 relative z-10">
            <div class="flex flex-col items-center justify-center space-y-4">
                
                <!-- Logo membulat dengan border tebal (Berada di tengah) -->
                <div class="bg-white p-1.5 rounded-full shadow-chunky border-4 border-kid-yellow h-20 w-20 md:h-24 md:w-24 flex items-center justify-center overflow-hidden transform hover:scale-110 hover:rotate-6 transition-all duration-300">
                    <img src="logo.png" alt="Logo SKPK Miri" class="h-full w-auto object-contain rounded-full" 
                         onerror="this.onerror=null; this.src='https://placehold.co/100x100/FDCB6E/ffffff?text=SKPK';">
                </div>
                
                <!-- Tajuk Aplikasi dengan font Display (Fredoka) di tengah -->
                <div class="flex flex-col items-center text-center w-full">
                    <h1 class="text-4xl md:text-5xl font-display font-bold tracking-wider leading-tight text-white mb-3" 
                        style="text-shadow: 0 4px 0px rgba(0, 0, 0, 0.15), 0 2px 10px rgba(0,0,0,0.2);">
                        BAHASA MELAYU
                    </h1>
                    
                    <div class="flex flex-wrap justify-center items-center gap-3">
                        <span class="bg-kid-yellow text-slate-800 text-sm md:text-base font-bold px-4 py-2 rounded-full shadow-chunky border-2 border-white/50 hover:-translate-y-1 transition-transform cursor-default">
                            <i class="fas fa-ear-deaf mr-2 text-kid-orange"></i> Masalah Pendengaran
                        </span>
                        <span class="bg-kid-green text-white text-sm md:text-base font-bold px-4 py-2 rounded-full shadow-chunky border-2 border-white/50 hover:-translate-y-1 transition-transform cursor-default">
                            <i class="fas fa-school mr-2 text-kid-yellow"></i> SK Pendidikan Khas Miri
                        </span>
                    </div>
                </div>

            </div>
        </div>
    </header>

    <!-- Kawasan Menu Utama (Paparan Penuh) -->
    <main class="flex-1 overflow-y-auto mt-4 mb-8 px-4 md:px-8 w-full z-10 relative">
        <div class="max-w-6xl mx-auto space-y-8">
            
            <!-- Kumpulan Tahun 1-6 -->
            <section class="bg-white/70 backdrop-blur-md p-6 md:p-8 rounded-[2rem] border-4 border-white shadow-floating animate-bounce-in">
                <div class="flex items-center justify-center mb-8">
                    <span class="bg-white text-kid-blue py-3 px-8 rounded-full font-display text-xl md:text-2xl font-bold tracking-wide inline-flex items-center shadow-sm border-2 border-kid-blue/20">
                        <i class="fas fa-star text-kid-yellow mr-3 text-2xl md:text-3xl"></i>
                        PILIH KELAS ANDA
                        <i class="fas fa-star text-kid-yellow ml-3 text-2xl md:text-3xl"></i>
                    </span>
                </div>
                
                <!-- Tukar kepada md:grid-cols-6 supaya terus memanjang 1 baris di kebanyakan skrin (Tablet/Laptop) -->
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3 lg:gap-4">
                    <!-- Tahun 1: Merah -->
                    <button class="hover-wiggle group flex flex-col items-center justify-center py-5 px-2 bg-white rounded-2xl md:rounded-3xl border-4 border-kid-red border-b-[8px] hover:border-b-4 hover:translate-y-[4px] hover:bg-red-50 transition-all duration-200 outline-none shadow-sm cursor-pointer">
                        <span class="bg-red-100 text-kid-red group-hover:scale-110 w-14 h-14 md:w-16 md:h-16 rounded-full flex items-center justify-center mb-3 transition-transform duration-300">
                            <i class="fas fa-apple-whole text-2xl md:text-3xl"></i>
                        </span>
                        <span class="font-display text-lg md:text-xl font-bold text-slate-700 group-hover:text-kid-red transition-colors whitespace-nowrap">Tahun 1</span>
                    </button>
                    
                    <!-- Tahun 2: Oren -->
                    <button class="hover-wiggle group flex flex-col items-center justify-center py-5 px-2 bg-white rounded-2xl md:rounded-3xl border-4 border-kid-orange border-b-[8px] hover:border-b-4 hover:translate-y-[4px] hover:bg-orange-50 transition-all duration-200 outline-none shadow-sm cursor-pointer">
                        <span class="bg-orange-100 text-kid-orange group-hover:scale-110 w-14 h-14 md:w-16 md:h-16 rounded-full flex items-center justify-center mb-3 transition-transform duration-300">
                            <i class="fas fa-car text-2xl md:text-3xl"></i>
                        </span>
                        <span class="font-display text-lg md:text-xl font-bold text-slate-700 group-hover:text-kid-orange transition-colors whitespace-nowrap">Tahun 2</span>
                    </button>
                    
                    <!-- Tahun 3: Kuning/Emas -->
                    <button class="hover-wiggle group flex flex-col items-center justify-center py-5 px-2 bg-white rounded-2xl md:rounded-3xl border-4 border-[#E5A93D] border-b-[8px] hover:border-b-4 hover:translate-y-[4px] hover:bg-yellow-50 transition-all duration-200 outline-none shadow-sm cursor-pointer">
                        <span class="bg-yellow-100 text-[#E5A93D] group-hover:scale-110 w-14 h-14 md:w-16 md:h-16 rounded-full flex items-center justify-center mb-3 transition-transform duration-300">
                            <i class="fas fa-sun text-2xl md:text-3xl"></i>
                        </span>
                        <span class="font-display text-lg md:text-xl font-bold text-slate-700 group-hover:text-[#E5A93D] transition-colors whitespace-nowrap">Tahun 3</span>
                    </button>
                    
                    <!-- Tahun 4: Hijau -->
                    <button class="hover-wiggle group flex flex-col items-center justify-center py-5 px-2 bg-white rounded-2xl md:rounded-3xl border-4 border-kid-green border-b-[8px] hover:border-b-4 hover:translate-y-[4px] hover:bg-green-50 transition-all duration-200 outline-none shadow-sm cursor-pointer">
                        <span class="bg-green-100 text-kid-green group-hover:scale-110 w-14 h-14 md:w-16 md:h-16 rounded-full flex items-center justify-center mb-3 transition-transform duration-300">
                            <i class="fas fa-tree text-2xl md:text-3xl"></i>
                        </span>
                        <span class="font-display text-lg md:text-xl font-bold text-slate-700 group-hover:text-kid-green transition-colors whitespace-nowrap">Tahun 4</span>
                    </button>
                    
                    <!-- Tahun 5: Biru -->
                    <button class="hover-wiggle group flex flex-col items-center justify-center py-5 px-2 bg-white rounded-2xl md:rounded-3xl border-4 border-kid-blue border-b-[8px] hover:border-b-4 hover:translate-y-[4px] hover:bg-blue-50 transition-all duration-200 outline-none shadow-sm cursor-pointer">
                        <span class="bg-blue-100 text-kid-blue group-hover:scale-110 w-14 h-14 md:w-16 md:h-16 rounded-full flex items-center justify-center mb-3 transition-transform duration-300">
                            <i class="fas fa-fish text-2xl md:text-3xl"></i>
                        </span>
                        <span class="font-display text-lg md:text-xl font-bold text-slate-700 group-hover:text-kid-blue transition-colors whitespace-nowrap">Tahun 5</span>
                    </button>
                    
                    <!-- Tahun 6: Ungu -->
                    <button class="hover-wiggle group flex flex-col items-center justify-center py-5 px-2 bg-white rounded-2xl md:rounded-3xl border-4 border-kid-purple border-b-[8px] hover:border-b-4 hover:translate-y-[4px] hover:bg-purple-50 transition-all duration-200 outline-none shadow-sm cursor-pointer">
                        <span class="bg-purple-100 text-kid-purple group-hover:scale-110 w-14 h-14 md:w-16 md:h-16 rounded-full flex items-center justify-center mb-3 transition-transform duration-300">
                            <i class="fas fa-rocket text-2xl md:text-3xl"></i>
                        </span>
                        <span class="font-display text-lg md:text-xl font-bold text-slate-700 group-hover:text-kid-purple transition-colors whitespace-nowrap">Tahun 6</span>
                    </button>
                </div>
            </section>

            <!-- Kumpulan Tambahan: Main & Profil -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">
                
                <!-- Kumpulan Rujukan & Main -->
                <section class="bg-white/70 backdrop-blur-md p-6 md:p-8 rounded-[2rem] border-4 border-white shadow-floating animate-bounce-in" style="animation-delay: 0.1s; animation-fill-mode: both;">
                    <div class="flex items-center justify-center mb-6">
                        <span class="bg-white text-kid-pink py-2 px-6 rounded-full font-display text-lg font-bold tracking-wide inline-flex items-center shadow-sm border-2 border-kid-pink/20">
                            <i class="fas fa-heart text-kid-pink mr-2 text-xl"></i>
                            RUJUKAN & MAIN
                            <i class="fas fa-heart text-kid-pink ml-2 text-xl"></i>
                        </span>
                    </div>
                    
                    <div class="space-y-4">
                        <button class="hover-wiggle group w-full flex items-center p-4 md:p-5 bg-white rounded-3xl border-4 border-kid-pink border-b-[8px] hover:border-b-4 hover:translate-y-[4px] hover:bg-pink-50 transition-all duration-200 outline-none shadow-sm cursor-pointer">
                            <span class="bg-pink-100 text-kid-pink group-hover:scale-110 w-16 h-16 rounded-full flex items-center justify-center mr-6 transition-transform duration-300 flex-shrink-0">
                                <i class="fas fa-gamepad text-3xl"></i>
                            </span>
                            <span class="font-display text-2xl font-bold text-slate-700 group-hover:text-kid-pink transition-colors text-left">Permainan Bahasa</span>
                        </button>
                        
                        <button class="hover-wiggle group w-full flex items-center p-4 md:p-5 bg-white rounded-3xl border-4 border-kid-orange border-b-[8px] hover:border-b-4 hover:translate-y-[4px] hover:bg-orange-50 transition-all duration-200 outline-none shadow-sm cursor-pointer">
                            <span class="bg-orange-100 text-kid-orange group-hover:scale-110 w-16 h-16 rounded-full flex items-center justify-center mr-6 transition-transform duration-300 flex-shrink-0">
                                <i class="fas fa-hands-asl-interpreting text-3xl"></i>
                            </span>
                            <span class="font-display text-2xl font-bold text-slate-700 group-hover:text-kid-orange transition-colors text-left">Rujukan Isyarat</span>
                        </button>
                    </div>
                </section>

                <!-- Kumpulan Profil -->
                <section class="bg-white/70 backdrop-blur-md p-6 md:p-8 rounded-[2rem] border-4 border-white shadow-floating animate-bounce-in flex flex-col justify-center" style="animation-delay: 0.2s; animation-fill-mode: both;">
                    <div class="flex items-center justify-center mb-6">
                        <span class="bg-white text-slate-700 py-2 px-6 rounded-full font-display text-lg font-bold tracking-wide inline-flex items-center shadow-sm border-2 border-slate-200">
                            <i class="fas fa-circle-info text-kid-blue mr-2 text-xl"></i>
                            MAKLUMAT
                            <i class="fas fa-circle-info text-kid-blue ml-2 text-xl"></i>
                        </span>
                    </div>

                    <button class="hover-wiggle group w-full flex items-center p-6 md:p-8 bg-kid-yellow/20 rounded-3xl border-4 border-kid-yellow border-b-[8px] hover:border-b-4 hover:translate-y-[4px] hover:bg-kid-yellow/30 transition-all duration-200 outline-none shadow-sm cursor-pointer mt-auto mb-auto">
                        <span class="bg-white text-kid-yellow w-20 h-20 rounded-full flex items-center justify-center mr-6 shadow-sm group-hover:scale-110 transition-transform duration-300 flex-shrink-0">
                            <i class="fas fa-laptop-code text-4xl"></i>
                        </span>
                        <div class="text-left">
                            <span class="block font-display text-3xl font-bold text-slate-800 transition-colors">Pembina Aplikasi</span>
                            <span class="block text-slate-600 font-medium text-lg mt-1">Kenali pembina aplikasi</span>
                        </div>
                    </button>
                </section>

            </div>
        </div>
    </main>

    <script>
        // CSS Ringkas untuk Animasi "Bounce In" yang ceria
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes bounceIn {
                0% { opacity: 0; transform: scale(0.9) translateY(40px); }
                60% { opacity: 1; transform: scale(1.02) translateY(-10px); }
                100% { opacity: 1; transform: scale(1) translateY(0); }
            }
            .animate-bounce-in {
                animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
